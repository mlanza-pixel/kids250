   const fetchJSON=async file=>{const r=await fetch('./'+file+'?build='+RELEASE.build+'',{cache:'no-store'});if(!r.ok)throw Error(file+' returned HTTP '+r.status);return r.json()};
   const [a,b,examples]=await Promise.all([fetchJSON('curriculum.json'),fetchJSON('words.json'),fetchJSON('usage_examples.json')]);USE_IT=examples;
   if(!Array.isArray(a)||a.length!==25)throw Error('Expected 25 missions in curriculum.json');

   for(let mi=0;mi<25;mi++){
    const m=a[mi],c=contract[mi];
    if(m.title!==c.subject||m.stops.length!==10)throw Error('Subject mismatch in mission '+m.id);
    for(let si=0;si<10;si++){
     const w=m.stops[si],num=mi*10+si+1,im=images[num-1],flat=b[num-1];
     if(w.es!==c.expectedSpanish[si]||w.en!==c.expectedEnglish[si]||w.imageNumber!==num||im.cardId!==w.id||im.filename!==w.originalFile||im.es!==w.es||flat.id!==w.id||flat.file!==w.originalFile)throw Error('Card/image mismatch at picture '+num);
    }
   }

   if(all.some(w=>!Array.isArray(USE_IT[w.es])||USE_IT[w.es].length!==2))throw Error('Missing usage example');missions=a;legacy=b;
   if(!state.core250Migration){let classic=await fetchJSON('curriculum_classic_v6_2.json');let completed=new Set(classic.flatMap(m=>m.stops.filter(w=>state.visited[w.id]).map(w=>w.es.toLocaleLowerCase('es').trim().replace(/^(el|la|los|las|un|una)\s+/,'').trim())));state.classicStamps={...(state.stamps||{})};state.classicVisited={...(state.visited||{})};state.stamps={};state.reviewResults={};state.pendingReward=null;state.lastLesson=null;state.visited={};for(let m of missions)for(let w of m.stops)if(completed.has(w.es.toLocaleLowerCase('es').trim()))state.visited[w.id]=true;state.core250Migration=true;save();}


   if(state.subjectCurriculumVersion!==RELEASE.curriculumVersion){
    const prior=await fetchJSON('curriculum_v640_archive.json');
    const normal=s=>String(s).toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const learned=new Set(prior.flatMap(m=>m.stops.filter(w=>state.visited[w.id]).map(w=>normal(w.es))));
    for(const m of missions)for(const w of m.stops)if(state.visited[w.id])learned.add(normal(w.es));
    const older=await fetchJSON('curriculum_classic_v6_2.json');for(const m of older)for(const w of m.stops)if(state.classicVisited?.[w.id])learned.add(normal(w.es.replace(/^(el|la|los|las|un|una)\s+/i,'')));
    state.previousCurriculum=state.previousCurriculum||{};
    state.previousCurriculum['6.4.0']={visited:{...state.visited},stamps:{...state.stamps},reviewResults:{...state.reviewResults},lastLesson:state.lastLesson};
    state.visited={};for(const m of missions)for(const w of m.stops)if(learned.has(normal(w.es)))state.visited[w.id]=true;
    state.stamps={};state.reviewResults={};state.mistakes={};state.practiced={};state.lastLesson=null;state.pendingReward=null;
    state.subjectCurriculumVersion=RELEASE.curriculumVersion;save();
   }

   syncMode();document.getElementById('versionTag').textContent='v'+RELEASE.version;
   if(state.onboarded)home();else splash();
   if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=6.8.0',{updateViaCache:'none'}).then(r=>{watchUpdates(r);return r.update()}).catch(e=>console.warn('Service worker:',e));
 }catch(e){
   console.error('Startup failure:',e);
   status.innerHTML='<div class="card"><h2>Could not start the adventure</h2><p>'+safe(e.message)+'</p><p>Make sure index.html, curriculum.json and words.json are all in the GitHub repository root.</p><button class="btn" onclick="location.reload()">Try again</button><button class="btn alt" onclick="clearAppCache()">Clear app cache & reload</button><p class="tiny">Your saved progress will not be deleted.</p></div>';
 }finally{clearTimeout(t)}
}
function watchUpdates(reg){if(!reg)return;const prompt=()=>{if(document.getElementById('updateBanner'))return;let b=document.createElement('div');b.id='updateBanner';b.className='update-banner';b.innerHTML='<span>✨ New adventure available!</span><button class="btn" id="applyUpdate">Update now</button><button class="btn alt" id="laterUpdate">Later</button>';document.body.appendChild(b);document.getElementById('applyUpdate').onclick=()=>{if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});else location.reload()};document.getElementById('laterUpdate').onclick=()=>b.remove()};if(reg.waiting)prompt();reg.addEventListener('updatefound',()=>{let w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)prompt()})});}
let hadController=!!navigator.serviceWorker?.controller;if('serviceWorker'in navigator)navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController)location.reload();hadController=true});
async function clearAppCache(){
 try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope===new URL('./',location.href).href).map(r=>r.unregister()))}
 if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('spanish-agent-')).map(k=>caches.delete(k)))}
 }catch(e){console.warn('Cache reset:',e)}
 location.reload();
}
window.addEventListener('error',e=>{const a=document.getElementById('app');if(a&&a.textContent.includes('Loading your cozy adventure'))a.innerHTML='<div class="card"><h2>Startup error</h2><p>'+safe(e.message)+'</p><button class="btn" onclick="clearAppCache()">Clear app cache & reload</button></div>'});
// v6.7: default early-reader flow. Existing curriculum and advanced activity functions remain intact.
function isLittle(){return state.learningMode!=='independent'}
function syncMode(){document.body.classList.toggle('little-mode',isLittle());document.body.classList.toggle('book-not-started',!state.onboarded);document.body.classList.toggle('independent-mode',!isLittle())}
let littleGroup=0,littleReplay=false,littleQuiz=[],littleAt=0,littleScore=0,littleLocked=false,littleOptions=[],parentChallenge=null;
function littleWelcome(){syncMode();app.innerHTML='<section class="card little-welcome"><img class="little-fox" src="images/storybook/fox.webp" alt="Your friendly fox guide"><h1>Hello, explorer!</h1><p>Look. Listen. Say it!</p><p>Tap a picture to listen. Turn the page to explore.</p><label for="agentName">Your name or nickname</label><input id="agentName" maxlength="24" autocomplete="off" value="'+safe(agentName())+'" placeholder="Your name"><button class="btn" onclick="saveAgent()">▶ Let’s play!</button><p class="tiny">A grown-up can choose a different learning level in ⚙ Parent settings.</p><p id="speechStatus" class="status" aria-live="polite"></p></section>'}
function littlePlay(){const pending=state.pendingReward;if(pending?.phase==='stamp'&&!state.stamps[pending.mission]){active=pending.mission;stampPicker();return}const mark=state.bookBookmark;if(mark&&!mark.replay&&!state.stamps[mark.mission]&&missions[mark.mission-1]&&Number.isInteger(mark.stop)&&mark.stop>=0&&mark.stop<10){active=mark.mission;littleGroup=mark.group===1?1:0;littleReplay=false;littleLearn(mark.stop);return}const next=missions.find(m=>!state.stamps[m.id])||missions[0];littleMission(next.id)}
function littleMission(n){active=n;littleReplay=false;state.littleReviews=state.littleReviews||{};const progress=state.littleReviews[n]||{};littleGroup=progress.first?1:0;littleResume()}
function littleResume(){const m=missions[active-1],start=littleGroup*5;const i=m.stops.findIndex((w,i)=>i>=start&&i<start+5&&!state.visited[w.id]);if(i<0)littleQuizStart();else littleLearn(i)}
function littleReplayDone(){app.innerHTML=littleNav()+'<section class="card celebration little-center"><h1>Lovely listening!</h1><p>You said five Spanish words.</p><button class="btn" onclick="littleHome()">⌂ Home</button></section>';say('Lovely listening! You said five Spanish words.','en-US')}
function littleListenAgain(){const last=state.lastLesson;active=last&&missions[last.mission-1]?last.mission:1;littleGroup=last&&Number.isInteger(last.stop)&&last.stop>=5?1:0;littleReplay=true;littleLearn(littleGroup*5)}
function littleQuizStart(){littleReplay=false;littleQuiz=shuffled(missions[active-1].stops.slice(littleGroup*5,littleGroup*5+5));littleAt=0;littleScore=0;littleQuizQuestion()}
function littleQuizQuestion(){if(littleAt>=littleQuiz.length){littleFinishGroup();return}littleLocked=false;const w=littleQuiz[littleAt];const pool=missions.flatMap(m=>m.stops).filter(x=>x.id!==w.id&&x.en!==w.en&&x.emoji!==w.emoji);littleOptions=shuffled([w,shuffled(pool)[0]]);app.innerHTML=littleNav()+'<section class="card little-center"><span class="pill">Picture game · '+(littleAt+1)+' / 5</span><h1>Which picture?</h1><button class="btn" onclick="say(littleQuiz[littleAt].es)">🔊 Listen again</button><p class="tiny">Listen to the Spanish word. Tap its picture.</p><div class="little-choices">'+littleOptions.map((x,i)=>'<button class="little-picture" data-little-id="'+x.id+'" onclick="littleAnswer('+i+')" aria-label="'+safe(x.en)+'">'+art(x)+'</button>').join('')+'</div><p id="littleFeedback" class="status" role="status"></p><p id="speechStatus" class="status" aria-live="polite"></p><button id="littleNext" class="btn hidden" onclick="littleAt++;littleQuizQuestion()">Next →</button></section>';say(w.es)}
function littleAnswer(i){if(littleLocked)return;littleLocked=true;const w=littleQuiz[littleAt],ok=littleOptions[i]?.id===w.id;if(ok)littleScore++;recordAnswer(w,ok);document.querySelectorAll('[data-little-id]').forEach(b=>{b.disabled=true;if(b.dataset.littleId===w.id){b.classList.add('good');b.insertAdjacentHTML('beforeend','<span class="answer-mark" aria-label="Correct picture">✓</span>')}else if(b===document.querySelectorAll('[data-little-id]')[i]){b.classList.add('bad');b.insertAdjacentHTML('beforeend','<span class="answer-mark" aria-label="Try next time">✗</span>')}});document.getElementById('littleFeedback').textContent=(ok?'✓ Well done! ':'Good try! ✓ ')+w.es+' means '+w.en+'.';const next=document.getElementById('littleNext');next.classList.remove('hidden');next.focus({preventScroll:true});say(w.es)}
function littleFinishGroup(){state.littleReviews=state.littleReviews||{};const rec=state.littleReviews[active]||{};rec[littleGroup?'second':'first']={score:littleScore,total:5,completedAt:new Date().toISOString()};state.littleReviews[active]=rec;save();if(littleGroup===0){app.innerHTML=littleNav()+'<section class="card celebration little-center"><div class="little-reward" aria-hidden="true">⭐</div><h1>Five words! Hooray!</h1><p>You can rest or try five more.</p><div class="little-controls"><button class="btn" onclick="littleGroup=1;littleResume()">▶ Five more</button><button class="btn alt" onclick="littleHome()">⌂ Rest for now</button></div></section>';say('Five words! Hooray! You can rest, or try five more.','en-US');return}if(!rec.first||!missions[active-1].stops.every(w=>state.visited[w.id])){littleGroup=0;littleResume();return}state.reviewResults=state.reviewResults||{};state.reviewResults[active]={score:(rec.first.score||0)+littleScore,total:10,mode:'little-picture',completedAt:new Date().toISOString()};if(state.stamps[active]){save();app.innerHTML=littleNav()+'<section class="card celebration little-center"><h1>You did it again!</h1><div class="little-reward">'+safe(state.stamps[active])+'</div><button class="btn" onclick="littleHome()">⌂ Home</button></section>'}else{state.pendingReward={mission:active,phase:'stamp'};save();stampPicker();say('Ten words! Choose your treasure stamp!','en-US')}}
function littleStamps(){app.innerHTML=littleNav()+'<section class="card little-center"><h1>My Stamps</h1><p>'+missions.filter(m=>state.stamps[m.id]).length+' / 25 adventures</p><div class="little-passport">'+missions.map(m=>'<div class="little-stamp '+(state.stamps[m.id]?'earned':'')+'" aria-label="'+safe(m.title)+(state.stamps[m.id]?' stamp earned':' not earned yet')+'"><span aria-hidden="true">'+safe(state.stamps[m.id]||'○')+'</span><small>'+safe(m.title)+'</small></div>').join('')+'</div></section>'}
function littleStampPicker(){app.innerHTML=littleNav()+'<section class="card little-center"><h1>Pick your stamp!</h1><div class="stamp-options little-stamp-options">'+[0,3,5].map(i=>'<button class="stamp-choice" onclick="littleAward('+i+')" aria-label="Choose '+STAMP_CHOICES[i][1]+' stamp">'+STAMP_CHOICES[i][0]+'<span>'+STAMP_CHOICES[i][1]+'</span></button>').join('')+'</div></section>'}
function littleAward(i){if(!STAMP_CHOICES[i]||!missions[active-1].stops.every(w=>state.visited[w.id])||!state.reviewResults?.[active])return;if(!state.stamps[active])state.stamps[active]=STAMP_CHOICES[i][0];state.pendingReward=null;save();app.innerHTML=littleNav()+'<section class="card celebration little-center"><h1>Your treasure stamp!</h1><div class="little-reward">'+safe(state.stamps[active])+'</div><p>'+safe(missions[active-1].title)+'</p><button class="btn" onclick="littleHome()">⌂ Home</button></section>';say('Hooray! Your treasure stamp is saved!','en-US')}
// A reading gate limits accidental changes. It is not authentication or security.
function parentGate(){parentChallenge={a:Math.floor(Math.random()*5)+6,b:Math.floor(Math.random()*5)+3};app.innerHTML='<section class="card parent-settings"><h1>For grown-ups</h1><p>Ask your grown-up to choose your learning level.</p><form onsubmit="event.preventDefault();checkParentGate()"><label for="parentAnswer">What is '+parentChallenge.a+' + '+parentChallenge.b+'?</label><input id="parentAnswer" type="number" inputmode="numeric" autocomplete="off"><button class="btn" type="submit">Open settings</button></form><p id="parentFeedback" class="status" role="status"></p><button class="btn alt" onclick="home()">⌂ Back to play</button></section>'}
function checkParentGate(){if(!parentChallenge)return;if(Number(document.getElementById('parentAnswer').value)!==parentChallenge.a+parentChallenge.b){document.getElementById('parentFeedback').textContent='Ask your grown-up for help.';return}parentChallenge=null;parentSettings()}
function parentSettings(){app.innerHTML='<section class="card parent-settings"><h1>Learning level</h1><p>Choose by reading confidence. Both levels keep the same name, learned words and stamps.</p><button class="mode-choice '+(isLittle()?'selected':'')+'" onclick="setLearningMode(&quot;little&quot;)"><strong>Little Explorers</strong><span>Suggested ages 5–6 · Five words at a time · Two-picture games · Spoken prompts</span><small>'+(isLittle()?'✓ Current level':'Choose this level')+'</small></button><button class="mode-choice '+(!isLittle()?'selected':'')+'" onclick="setLearningMode(&quot;independent&quot;)"><strong>Independent Agents</strong><span>Suggested ages 7–9 or adult-guided · Full activities · Written Spanish choices</span><small>'+(!isLittle()?'✓ Current level':'Choose this level')+'</small></button><p class="tiny">Picture placeholders are still awaiting approved photographs. Abstract words and relationships may need an adult’s explanation. A level choice is not a reading assessment.</p><div class="row"><button class="btn alt" onclick="myAgent()">Change nickname</button><button class="btn alt" onclick="developer()">Diagnostics</button><button class="btn" onclick="home()">Done →</button></div></section>'}
function setLearningMode(mode){if(!['little','independent'].includes(mode))return;audioMuted=false;state.learningMode=mode;save();try{speechSynthesis.cancel()}catch{}syncMode();home()}

// Book presentation reuses the same curriculum, quiz logic and progress records.
let bookDirection='forward';
function bookPaint(){if(!isLittle()||app.querySelector('.book-sheet,.book-cover'))return;const sheet=document.createElement('article');sheet.className='book-sheet '+(bookDirection==='back'?'page-back':'page-forward');sheet.setAttribute('aria-label','Adventure book page');while(app.firstChild)sheet.appendChild(app.firstChild);app.appendChild(sheet);bookDirection='forward'}
function littleNav(){return '<div class="book-running-head"><span>Spanish Agent Adventure</span><span aria-hidden="true">✦</span></div>'}
function littleHome(){syncMode();app.innerHTML='<section class="book-cover"><div class="book-cover-inner"><p class="book-kicker">A little book of big discoveries</p><h1>'+safe(agentName()?'Agent '+agentName()+'’s':'My')+'<br>Spanish Adventure</h1><img class="book-cover-art" src="images/storybook/explorer.webp" alt="An explorer ready for an adventure"><p>Look. Listen. Say it.</p><div class="little-home-actions"><button class="book-open btn" onclick="littlePlay()"><strong>Open book</strong> <span aria-hidden="true">→</span></button></div><p class="book-cover-progress">'+missions.filter(m=>state.stamps[m.id]).length+' / 25 treasure stamps</p><p id="speechStatus" class="status" aria-live="polite"></p></div></section>';bookDirection='forward'}
function bookContents(){app.innerHTML=littleNav()+'<section class="book-contents"><h1>Inside your book</h1><p>Choose a bookmark.</p><nav aria-label="Book contents"><button onclick="littlePlay()"><span>Read & Play</span><span aria-hidden="true">→</span></button><button onclick="littleStamps()"><span>My stamp passport</span><span aria-hidden="true">→</span></button><button onclick="littleListenAgain()"><span>Listen again</span><span aria-hidden="true">→</span></button></nav><button class="book-text-link" onclick="littleInstructions()">🔊 How to read & play</button><div class="book-contents-footer"><button class="book-text-link" onclick="littleHome()">← Cover</button><button class="book-text-link" onclick="parentGate()">For grown-ups ⚙</button></div><p id="speechStatus" class="status" aria-live="polite"></p></section>';bookPaint()}
function littleLearn(i){stop=Math.max(littleGroup*5,Math.min(littleGroup*5+4,i));const w=item(active,stop);state.lastLesson={mission:active,stop};state.bookBookmark={mission:active,group:littleGroup,stop,replay:littleReplay};save();app.innerHTML=littleNav()+'<section class="little-lesson book-word-page"><p class="book-chapter">'+safe(missions[active-1].title)+'</p><h1>'+safe(w.es)+'</h1><button class="little-picture book-illustration" onclick="say(item(active,stop).es)" aria-label="Hear the Spanish word for '+safe(w.en)+'">'+art(w)+'</button><p class="little-meaning">'+safe(w.en)+'</p><p class="book-picture-hint">Tap the picture to listen. Say it with me.</p><p id="speechStatus" class="status" aria-live="polite"></p><nav class="book-page-controls" aria-label="Turn book pages"><button class="book-page-arrow" onclick="bookPrevious()" aria-label="Previous word page" '+(stop%5===0?'disabled':'')+'>←</button><span class="book-page-number">Word '+(stop%5+1)+' of 5</span><button class="book-page-arrow book-next" onclick="littleComplete()" aria-label="'+(stop%5===4?'Finish these words and open the picture game':'Next word page')+'">→</button></nav></section>';bookPaint();say(w.es)}
function bookPrevious(){if(stop%5===0)return;bookDirection='back';littleLearn(stop-1)}
function littleComplete(){state.visited[item(active,stop).id]=true;save();bookDirection='forward';if(stop%5<4){littleLearn(stop+1);return}if(littleReplay){littleReplayDone();return}if(missions[active-1].stops.slice(littleGroup*5,littleGroup*5+5).some(w=>!state.visited[w.id])){littleResume();return}littleQuizStart()}
function littleInstructions(){const message=app.querySelector('.little-choices')?'Listen to the Spanish word. Tap its picture. Then turn the page.':'Open your book. Tap a picture to hear Spanish. Say the word with me. Use the arrow to turn the page. After five words, play a picture game. Your stamps and listening pages are in Contents.';say(message,'en-US')}
// Wrap the existing quiz, milestone and passport pages in the same paper frame.
for(const name of ['littleWelcome','littleQuizQuestion','littleFinishGroup','littleStamps','littleStampPicker','littleAward','littleReplayDone','parentGate','parentSettings']){
 const original=({littleWelcome,littleQuizQuestion,littleFinishGroup,littleStamps,littleStampPicker,littleAward,littleReplayDone,parentGate,parentSettings})[name];
 const wrapped=function(...args){const result=original(...args);if(name==='littleQuizQuestion'&&app.querySelector('.little-choices')){state.bookBookmark=null;save()}bookPaint();return result};
 if(name==='littleWelcome')littleWelcome=wrapped;if(name==='littleQuizQuestion')littleQuizQuestion=wrapped;if(name==='littleFinishGroup')littleFinishGroup=wrapped;if(name==='littleStamps')littleStamps=wrapped;if(name==='littleStampPicker')littleStampPicker=wrapped;if(name==='littleAward')littleAward=wrapped;if(name==='littleReplayDone')littleReplayDone=wrapped;if(name==='parentGate')parentGate=wrapped;if(name==='parentSettings')parentSettings=wrapped;
}

document.addEventListener('keydown',e=>{const b=e.target;if(!b.matches('.matching-choice')||!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const col=b.closest('.matching-col');const cols=[...document.querySelectorAll('.matching-col')];let list=[...col.querySelectorAll('button:not(:disabled)')],i=list.indexOf(b);if(e.key==='ArrowDown')list[(i+1)%list.length]?.focus();if(e.key==='ArrowUp')list[(i+list.length-1)%list.length]?.focus();if(e.key==='ArrowRight'||e.key==='ArrowLeft')cols[1-cols.indexOf(col)]?.querySelector('button:not(:disabled)')?.focus()});boot();
</script></body></html>

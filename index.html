const specialSounds={'hola':'OH-lah','adiós':'ah-DYOHSS','buenos días':'BWEH-nohs DEE-ahs','buenas tardes':'BWEH-nahs TAR-dess','buenas noches':'BWEH-nahs NOH-chess','hasta luego':'AHS-tah LWEH-goh','hasta mañana':'AHS-tah mahn-YAH-nah','¿cómo estás?':'KOH-moh ess-TAHSS','gracias':'GRAH-syahs','por favor':'pohr fah-BOHR','sí':'see','no':'noh','yo':'yoh','tú':'too','uno':'OO-noh','dos':'dohss','tres':'tress','rojo':'ROH-hoh','azul':'ah-SOOL','verde':'BEHR-deh','amarillo':'ah-mah-REE-yoh','lunes':'LOO-ness','martes':'MAR-tess','miércoles':'MYEHR-koh-less','jueves':'HWEH-bess','viernes':'BYEHR-ness','sábado':'SAH-bah-doh','domingo':'doh-MEEN-goh','enero':'eh-NEH-roh','febrero':'feh-BREH-roh','marzo':'MAR-soh','abril':'ah-BREEL','mayo':'MAH-yoh','junio':'HOO-nyoh','julio':'HOO-lyoh','agosto':'ah-GOHS-toh','septiembre':'sep-TYEHM-breh','octubre':'ohk-TOO-breh','noviembre':'noh-BYEHM-breh','diciembre':'dee-SYEHM-breh','primavera':'pree-mah-BEH-rah','verano':'beh-RAH-noh','otoño':'oh-TOH-nyoh','invierno':'een-BYEHR-noh'};
function soundES(x){let t=String(x||'').toLowerCase().trim();if(specialSounds[t])return specialSounds[t];return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ch/g,'CH').replace(/ll/g,'Y').replace(/ñ/g,'ny').replace(/qu/g,'k').replace(/gue/g,'geh').replace(/gui/g,'gee').replace(/j/g,'h').replace(/ge/g,'heh').replace(/gi/g,'hee').replace(/v/g,'b').replace(/z/g,'s').replace(/ce/g,'seh').replace(/ci/g,'see').replace(/h/g,'').replace(/r/g,'r').replace(/a/g,'ah').replace(/e/g,'eh').replace(/i/g,'ee').replace(/o/g,'oh').replace(/u/g,'oo').replace(/\s+/g,'-');}
function soundEN(x){let t=String(x||'').toLowerCase().trim();let common={'hello':'heh-LOH','goodbye':'good-BYE','good morning':'good MOR-ning','good afternoon':'good af-ter-NOON','good night':'good NYTE','thank you':'THANK yoo','please':'PLEEZ','yes':'YESS','no':'NOH','red':'RED','blue':'BLOO','green':'GREEN','yellow':'YEL-oh','monday':'MUN-day','tuesday':'TOOZ-day','wednesday':'WENZ-day','thursday':'THURZ-day','friday':'FRY-day','saturday':'SAT-er-day','sunday':'SUN-day'};return common[t]||t.replace(/tion/g,'shun').replace(/ph/g,'f').replace(/ee/g,'ee').replace(/ing\b/g,'ing').replace(/\s+/g,'-');}

function renderPageHeader(title,subtitle=''){return '<div class="card hero"><h1>'+title+'</h1><p>'+subtitle+'</p></div>'}function home(){let got=Object.keys(state.stamps).filter(k=>state.stamps[k]).length;let explored=missions.reduce((a,m)=>a+m.stops.filter(w=>state.visited[w.id]).length,0);app.innerHTML=renderPageHeader('🗺️ Your Cozy Treasure Trails','24 little adventures · 5 bonuses · 5 magical map styles')+'<div class="card"><b>'+got+' / 24 treasure stamps collected</b><p><b>'+explored+' / 240 learning stops explored</b></p><div class="progress-track" role="progressbar" aria-label="Learning stops completed" aria-valuenow="'+explored+'" aria-valuemin="0" aria-valuemax="240"><div class="progress-fill" style="width:'+(explored/240*100)+'%"></div></div><p class="muted">Tap a mission to explore ten stops, then open its treasure chest after a gentle review.</p><div class="row"><button class="btn alt" onclick="bonus(1)">🔤 Alphabet Academy</button><button class="btn alt" onclick="glossary()">📚 Dictionary</button></div></div><div class="grid">'+missions.map(m=>'<button class="mission" onclick="map('+m.id+')"><span class="big">'+m.icon+'</span><span class="pill">Mission '+m.id+'</span><h3>'+safe(m.title)+'</h3><small>'+m.stops.filter(s=>state.visited[s.id]).length+'/10 discoveries · '+(state.stamps[m.id]?'🏆 Treasure earned':'🔒 Treasure awaits')+'</small></button>').join('')+'</div><div class="card bonus"><h2>🎁 Bonus Adventures</h2><div class="row"><button class="btn" onclick="bonus(1)">Bonus 1: Alphabet</button><button class="btn" onclick="bonus(2)">Bonus 2: Story Studio</button><button class="btn" onclick="bonus(3)">Bonus 3: Treasure Island</button><button class="btn" onclick="bonus(4)">Bonus 4: Days of Week</button><button class="btn" onclick="bonus(5)">Bonus 5: Months & Seasons</button></div></div>'}
const themes=[{name:'Enchanted Garden',bg:'#E8F4DD',path:'#D3AD85',deco:['🌸','🦋','🌼','🌷','🐝']},{name:'Floating Islands',bg:'#E5F3FB',path:'#AFC9D6',deco:['☁️','🌈','🪁','🕊️','☀️']},{name:'Winding River',bg:'#DFF2E9',path:'#8BC8CC',deco:['🪷','🐸','🦆','🌿','🐟']},{name:'Woodland Trail',bg:'#F1ECD9',path:'#C9AD82',deco:['🍄','🌲','🦊','🍂','🐿️']},{name:'Starry Sky',bg:'#E9E2F8',path:'#C2ADD8',deco:['⭐','🌙','✨','☁️','🌟']}];
function map(n){active=n;let m=missions[n-1],t=themes[m.theme],visited=m.stops.filter(s=>state.visited[s.id]).length;let coords=m.stops.map((_,i)=>({x:i%2?72:28,y:70+i*58}));let path=coords.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ');let last=coords[9];let svg='<svg viewBox="0 0 100 735" aria-label="Interactive treasure map: tap a numbered circle or treasure chest"><rect width="100" height="735" rx="8" fill="'+t.bg+'"/><path d="'+path+' L50 662" fill="none" stroke="'+t.path+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 9"/>';for(let i=0;i<10;i++){let q=coords[i],done=!!state.visited[m.stops[i].id];svg+='<g role="button" tabindex="0" aria-label="Open stop '+(i+1)+'" onclick="learn('+i+')" onkeydown="if(event.keyCode===13||event.keyCode===32){event.preventDefault();learn('+i+')}" style="cursor:pointer"><circle cx="'+q.x+'" cy="'+q.y+'" r="23" fill="'+(done?'#B6E9BA':'#FFFDF6')+'" stroke="#8E6EB4" stroke-width="2.5"/><text x="'+q.x+'" y="'+(q.y+5)+'" text-anchor="middle" font-size="16" font-weight="900" fill="#563779">'+(i+1)+'</text></g><text x="'+(q.x<50?59:10)+'" y="'+(q.y+4)+'" font-size="11">'+t.deco[i%5]+'</text>'}svg+='<text x="50" y="24" text-anchor="middle" font-size="11" font-weight="bold">START HERE ↓</text><g role="button" tabindex="0" aria-label="Open treasure chest" onclick="openChest()" onkeydown="if(event.keyCode===13||event.keyCode===32){event.preventDefault();openChest()}" style="cursor:pointer"><rect x="15" y="649" width="70" height="65" rx="12" fill="#fff6d5" stroke="#a78142" stroke-width="2"/><text x="50" y="694" text-anchor="middle" font-size="35">🎁</text></g></svg>';app.innerHTML=navBar()+'<div class="row between"><button class="btn alt" onclick="map(Math.max(1,active-1))" '+(active===1?'disabled':'')+'>← Mission</button><span class="pill">'+visited+'/10 explored</span><button class="btn alt" onclick="map(Math.min(24,active+1))" '+(active===24?'disabled':'')+'>Mission →</button></div>'+renderPageHeader(m.icon+' '+safe(m.title), function reviewQuestion(){if(reviewAt>=10){state.stamps[active]=true;save();app.innerHTML=navBar('map('+active+')')+renderPageHeader('🏆 Treasure found!','You earned the cozy mission stamp!')+'<div class="card" style="text-align:center"><div class="stamp">'+missions[active-1].icon+'🏅</div><h2>'+safe(missions[active-1].title)+'</h2><p>'+reviewScore+' / 10 correct. Every effort counts!</p><div class="row"><button class="btn" onclick="map('+active+')">See treasure map</button><button class="btn alt" onclick="home()">All missions</button></div></div>';return}reviewLocked=false;let w=reviewOrder[reviewAt],opts=[w,...missions[active-1].stops.filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);app.innerHTML=navBar('map('+active+')')+'<div class="card"><span class="pill">Treasure review '+(reviewAt+1)+'/10</span><h2>Which picture or meaning matches?</h2><h2>'+safe(w.es)+'</h2><button class="btn alt" onclick="say(reviewOrder[reviewAt].es)">🔊 Listen</button><div class="choices" style="margin-top:14px">'+opts.map(x=>'<button data-id="'+x.id+'" onclick="reviewAnswer(this)"><div style="font-size:34px">'+safe(x.emoji)+'</div>'+safe(x.en)+'</button>').join('')+'</div><p id="feedback" class="status" aria-live="polite"></p><p id="speechStatus" class="status"></p><button id="nextQ" class="btn hidden" onclick="reviewAt++;reviewQuestion()">Next →</button></div>'}

function bonus(n){if(n===1){app.innerHTML=navBar()+renderPageHeader('🔤 Alphabet Academy','Touch a letter and listen')+'<div class="card"><div class="stop-buttons">'+Array.from('ABCDEFGHIJKLMNÑOPQRSTUVWXYZ').map((c,i)=>'<button onclick="letter('+i+')">'+c+'</button>').join('')+'</div><div id="letterDetail"></div></div>';letter(0);return}if(n===2){app.innerHTML=navBar()+renderPageHeader('📖 Story Studio','Choose a greeting, then follow a little conversation')+'<div class="card"><div class="row">'+['Hola','Buenos días','¿Cómo estás?','Adiós'].map((t,i)=>'<button class="btn alt" onclick="story('+i+')">'+t+'</button>').join('')+'</div><div id="storyResult" class="detail">Tap a greeting to start!</div><p id="speechStatus" class="status"></p></div>';return}if(n===3){let available=missions.filter(m=>m.stops.every(s=>state.visited[s.id]));app.innerHTML=navBar()+renderPageHeader('🏝️ Treasure Island','Pick a mission by name to win its treasure')+'<div class="card"><div class="grid">'+(available.length?available.map(m=>'<button class="btn alt" onclick="active='+m.id+';reviewStart()">'+m.icon+' '+safe(m.title)+'</button>').join(''):'Explore all ten stops in a mission to unlock its treasure review!')+'</div></div>';return}if(n===4||n===5){let arr=n===4?calendarDays:calendarMonths;app.innerHTML=navBar()+renderPageHeader(n===4?'📅 Days of the Week':'🍁 Months & Seasons','Tap a word to hear Spanish')+'<div class="card"><div class="word-grid">'+arr.map((w,i)=>'<button class="bonus-word" onclick="say('+JSON.stringify(arr.map(x=>x.es)[i]).replace(/"/g,'&quot;')+')"><strong>'+safe(w.es)+'</strong><span>'+safe(w.en)+'</span>'+phonetics(w)+'<span>🔊 Listen</span></button>').join('')+'</div><p id="speechStatus" class="status"></p></div>';return}}
const letters='ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('');const ex=['Árbol','Barco','Casa','Dedo','Elefante','Flor','Gato','Helado','Isla','Jirafa','Kiwi','Luna','Manzana','Nube','Ñandú','Oso','Perro','Queso','Ratón','Sol','Tortuga','Uva','Vaca','Wafle','Xilófono','Yate','Zapato'];const names=['a','be','ce','de','e','efe','ge','hache','i','jota','ka','ele','eme','ene','eñe','o','pe','cu','erre','ese','te','u','uve','uve doble','equis','ye','zeta'];function letter(i){document.getElementById('letterDetail').innerHTML='<div class="detail"><h1>'+letters[i]+' '+letters[i].toLocaleLowerCase('es')+'</h1><h2>'+ex[i]+'</h2><div class="row"><button class="btn" onclick="say(names['+i+'])">🔊 Letter name</button><button class="btn alt" onclick="say(ex['+i+'])">🔊 Example word</button></div><p id="speechStatus" class="status"></p></div>'}function story(i){let lines=[{es:'Hola',en:'Hello!',next:1},{es:'¿Cómo estás?',en:'How are you?',next:2},{es:'Muy bien, gracias.',en:'Very well, thank you.',next:3},{es:'¡Hasta luego!',en:'See you later!',next:0}];let w=lines[i];document.getElementById('storyResult').innerHTML='<h2>'+safe(w.es)+'</h2><p>'+safe(w.en)+'</p>'+phonetics(w)+'<div class="row"><button class="btn alt" onclick="story('+((i+3)%4)+')">← Previous line</button><button class="btn" onclick="say('+JSON.stringify(w.es).replace(/"/g,'&quot;')+')">🔊 Listen</button><button class="btn" onclick="story('+w.next+')">What happens next? →</button></div>'}
function glossary(){let all=[...missions.flatMap(m=>m.stops),...legacy.map(w=>({es:w.es,en:w.en,emoji:'📖',originalFile:w.file})),...calendarDays,...calendarMonths];let seen=new Set();window.dict=all.filter(w=>{let k=(w.es+'|'+w.en).toLowerCase();if(seen.has(k))return false;seen.add(k);return true});app.innerHTML=navBar()+renderPageHeader('📚 Spanish Dictionary','Every word and phrase in the adventure, plus calendar bonuses · '+window.dict.length+' entries')+'<div class="card"><input id="search" placeholder="Search Spanish or English" oninput="dictRows()" aria-label="Search dictionary"><div id="dictResults"></div><p id="speechStatus" class="status"></p></div>';dictRows()}function dictRows(){let q=document.getElementById('search').value.toLowerCase();let matches=window.dict.filter(w=>(w.es+' '+w.en).toLowerCase().includes(q));document.getElementById('dictResults').innerHTML='<p>'+matches.length+' results</p>'+matches.map(w=>'<div class="dict-entry"><div><b>'+safe(w.es)+'</b> — '+safe(w.en)+phonetics(w)+'</div><button class="btn alt" onclick="say('+JSON.stringify(w.es).replace(/"/g,'&quot;')+')">🔊</button></div>').join('')}
function copyDiagnostics(){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(window.diagnosticReport).then(()=>alert('Copied diagnostic report')).catch(()=>alert(window.diagnosticReport))}else alert(window.diagnosticReport)}
async function developer(){let reg=await navigator.serviceWorker?.getRegistration().catch(()=>null);let cacheNames=await caches.keys().catch(()=>[]);let online='Unknown';try{let r=await fetch('./release.json?check='+Date.now(),{cache:'no-store'});if(r.ok){let latest=await r.json();online=latest.build===RELEASE.build?'Current build matches server':'Server build: '+latest.build+' (running '+RELEASE.build+')'}}catch{online='Cannot check server (offline?)'}let report=['Spanish Agent Adventure diagnostics','Version: '+RELEASE.version,'Build: '+RELEASE.build,'Build UTC: '+RELEASE.builtAtUTC,'Release ID: '+RELEASE.releaseId,'Curriculum: '+RELEASE.curriculumVersion,'Artwork: '+RELEASE.artworkInventoryVersion,'Cache expected: '+RELEASE.cacheVersion,'Cache actual: '+cacheNames.join(', '),'Service worker: '+(reg?.active?.scriptURL||'Not active'),'Server check: '+online,'Browser: '+navigator.userAgent].join('\n');window.diagnosticReport=report;app.innerHTML=renderPageHeader('⚙️ Developer Information','For parents and release troubleshooting')+'<div class="card"><h2>Running version '+RELEASE.version+'</h2><p><b>Build:</b> '+RELEASE.build+'</p><p><b>Built UTC:</b> '+RELEASE.builtAtUTC+'</p><p><b>Release ID:</b> '+RELEASE.releaseId+'</p><p><b>Curriculum:</b> '+RELEASE.curriculumVersion+'</p><p><b>Artwork:</b> '+RELEASE.artworkInventoryVersion+'</p><p><b>Expected cache:</b> '+RELEASE.cacheVersion+'</p><p><b>Installed caches:</b> '+safe(cacheNames.join(', '))+'</p><p><b>Service worker:</b> '+safe(reg?.active?.scriptURL||'Not active')+'</p><p><b>Latest server check:</b> '+safe(online)+'</p><div class="row"><button class="btn" onclick="copyDiagnostics()">📋 Copy diagnostics</button><button class="btn alt" onclick="location.reload()">↻ Refresh app</button><button class="btn alt" onclick="home()">← Home</button></div><p class="tiny">Refreshing does not delete saved progress. A newer release may require a second refresh after the service worker updates.</p></div>'}
async function boot(){
 const status=document.getElementById('app');
 const t=setTimeout(()=>{if(status.textContent.includes('Loading your cozy adventure'))status.innerHTML='<div class="card"><h2>Still loading…</h2><p>The lesson files are taking too long. Check your connection or update the cached app.</p><button class="btn" onclick="location.reload()">Try again</button><button class="btn alt" onclick="clearAppCache()">Clear app cache & reload</button><p class="tiny">Your saved progress will be kept.</p></div>'},7000);
 try{
   const fetchJSON=async file=>{const r=await fetch('./'+file+'?build='+RELEASE.build+'',{cache:'no-store'});if(!r.ok)throw Error(file+' returned HTTP '+r.status);return r.json()};
   const [a,b]=await Promise.all([fetchJSON('curriculum.json'),fetchJSON('words.json')]);
   if(!Array.isArray(a)||a.length!==24)throw Error('Expected 24 missions in curriculum.json');
   if(!Array.isArray(b)||b.length!==250)throw Error('Expected 250 entries in words.json');
   missions=a;legacy=b;
   document.getElementById('versionTag').textContent='v'+RELEASE.version;
   home();
   if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=6.0.4',{updateViaCache:'none'}).then(r=>r.update()).catch(e=>console.warn('Service worker:',e));
 }catch(e){
   console.error('Startup failure:',e);
   status.innerHTML='<div class="card"><h2>Could not start the adventure</h2><p>'+safe(e.message)+'</p><p>Make sure index.html, curriculum.json and words.json are all in the GitHub repository root.</p><button class="btn" onclick="location.reload()">Try again</button><button class="btn alt" onclick="clearAppCache()">Clear app cache & reload</button><p class="tiny">Your saved progress will not be deleted.</p></div>';
 }finally{clearTimeout(t)}
}
async function clearAppCache(){
 try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope===new URL('./',location.href).href).map(r=>r.unregister()))}
 if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('spanish-agent-')).map(k=>caches.delete(k)))}
 }catch(e){console.warn('Cache reset:',e)}
 location.reload();
}
window.addEventListener('error',e=>{const a=document.getElementById('app');if(a&&a.textContent.includes('Loading your cozy adventure'))a.innerHTML='<div class="card"><h2>Startup error</h2><p>'+safe(e.message)+'</p><button class="btn" onclick="clearAppCache()">Clear app cache & reload</button></div>'});
boot();
</script></body></html>

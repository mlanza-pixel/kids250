function art(w,cls=''){const base=w.file.replace(/\.[^.]+$/,'');return `<img class="word-art ${cls}" src="images/custom/${escapeHtml(w.file)}" data-default="images/defaults/${escapeHtml(base)}.svg" alt="${escapeHtml(w.en)}" onerror="if(this.src.indexOf('/defaults/')===-1){this.src=this.dataset.default}else{this.style.display='none'}">`}function emoji(w){let k=w.en.toLowerCase().replace(/^the\s+/,'').trim();return icons[k]||'🎨'}let spanishVoice=null,voiceListReady=false,speechBusy=false;
function loadVoices(){if(!('speechSynthesis' in window))return;const vs=window.speechSynthesis.getVoices();spanishVoice=vs.find(v=>/^es[-_]/i.test(v.lang)&&/enhanced|premium/i.test(v.name))||vs.find(v=>/^es[-_]/i.test(v.lang))||null;voiceListReady=vs.length>0;}
if('speechSynthesis' in window){loadVoices();window.speechSynthesis.addEventListener?.('voiceschanged',loadVoices);}
function speechStatus(t){const el=document.getElementById('speechStatus');if(el)el.textContent=t;}
function speak(t){
 if(!('speechSynthesis' in window)){speechStatus('Audio unavailable in this browser. Try Safari on your iPad.');return;}
 try{
  loadVoices();const synth=window.speechSynthesis;synth.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang=spanishVoice?.lang||'es-ES';u.rate=.82;u.pitch=1.05;u.volume=1;if(spanishVoice)u.voice=spanishVoice;
  u.onstart=()=>speechStatus('🔊 Playing Spanish…');u.onend=()=>speechStatus('✓ Finished playing');u.onerror=e=>speechStatus('Audio could not play ('+e.error+'). Check iPad volume and Spanish voice settings.');

}
function speakWord(){const w=words.filter(w=>w.mission===mission)[idx];if(w)speak(w.es)}

function welcome(){nav('about');app.innerHTML=`<div class="intro"><div style="font-size:65px">🌎 🐶 ⭐</div><span class="pill">Ages 5–9 · 25 adventures</span><h2>¡Hola, Explorador!</h2><h3>Spanish Agent Adventure</h3><p>Learn 250 everyday Spanish words with pictures, listening, games, and collectible stickers!</p><p>Look · Listen · Say · Play · Celebrate</p><button class="btn" onclick="localStorage.setItem('spanish-agent-welcomed','1');home()">🚀 Start My Adventure</button><p class="caption">No account, ads, or sign-in required.</p></div><div class="panel" style="margin-top:12px"><h3>For parents & teachers</h3><p>Try a 10–15 minute session. Explore a mission, listen to each word, and practice together. Speech uses your device's available Spanish voices.</p></div>`}
function home(){nav('home');let done=words.filter(w=>progress[w.file]).length;app.innerHTML=`<div class="hero"><span class="pill">¡Hola, Agent!</span><h2>Choose your next mission 🗺️</h2><p>Each mission starts with a briefing, 10 pictures, and a fun review.</p><div class="progress"><div style="width:${done/250*100}%"></div></div><b>${done} / 250 words explored · ${Object.keys(earned).filter(k=>earned[k]).length} stickers</b></div><div class="grid">${Array.from({length:25},(_,i)=>{let a=pool(i+1),count=a.filter(w=>progress[w.file]).length;return `<button class="tile" onclick="brief(${i+1})"><span class="pill">Mission ${i+1} · ${count}/10</span><h3>${escapeHtml(a[0].titleEN)}</h3><div>${escapeHtml(a[0].titleES)}</div><div class="progress"><div style="width:${count*10}%"></div></div><span class="caption">${earned[i+1]?'🏅 Sticker earned':'View mission →'}</span></button>`}).join('')}</div>`}
function brief(n){mission=n;idx=0;nav('home');const a=pool(n),w=a[0];app.innerHTML=`<button class="back" onclick="home()">← Mission map</button><div class="intro"><span class="pill">MISSION ${n} OF 25</span><h2>${escapeHtml(w.titleES)}</h2><h3>${escapeHtml(w.titleEN)}</h3><div class="sticker">${stickerIcons[n-1]}</div><p>${escapeHtml(w.brief)}</p><h3>Meet your 10 pictures</h3><div class="mission-pics">${a.map((x,i)=>`<button class="mini-pic" onclick="speakByFile('${x.file}')" aria-label="Hear ${escapeHtml(x.es)}">${art(x)}<span>${escapeHtml(x.en)}</span></button>`).join('')}</div><p class="small">Tap any picture to hear its Spanish word.</p><p id="speechStatus" class="status" aria-live="polite"></p><button class="btn" onclick="start(${n})">📚 Let's Learn!</button><div class="actions"><button class="secondary" onclick="missionReview(${n})">⭐ Review mission</button></div></div>`}
function speakByFile(file){const w=words.find(x=>x.file===file);if(w)speak(w.es)}
function start(n){mission=n;idx=0;showWord()}
function showWord(){nav('home');let a=pool(mission),w=a[idx];app.innerHTML=`<button class="back" onclick="brief(${mission})">← Mission ${mission} briefing</button><div class="panel"><span class="pill">Mission ${mission} · Word ${idx+1} of 10</span><div class="progress"><div style="width:${(idx+1)*10}%"></div></div><h2>${escapeHtml(w.titleEN)}</h2><button class="pic" style="width:100%;padding:8px;border:0" onclick="speakWord()" aria-label="Hear ${escapeHtml(w.es)}">${art(w)}</button><div class="caption">Tap the picture to hear Spanish</div><h2 class="word">${escapeHtml(w.es)}</h2><p class="muted">(${escapeHtml(w.pron)}) · ${escapeHtml(w.en)}</p><p class="sentence">${escapeHtml(w.sentence)}</p><div class="card-actions"><button class="btn" onclick="speakWord()">🔊 Hear word</button><button class="secondary" onclick="speakSentence()">🔊 Hear sentence</button></div><p id="speechStatus" class="status" aria-live="polite">Tap a speaker to listen.</p><button class="secondary" onclick="toggleFavorite('${w.file}');showWord()">${favorites[w.file]?'♥ Saved favorite':'♡ Save favorite'}</button><div class="card-actions" style="margin-top:14px"><button class="secondary" onclick="prev()" ${idx===0?'disabled':''}>← Previous</button><button class="orange" onclick="next()">${idx===9?'🎮 Start review':'Next word →'}</button></div></div>`}
function toggleFavorite(file){favorites[file]=!favorites[file];persist()}
function prev(){idx=Math.max(0,idx-1);showWord()}
function next(){const a=pool(mission);progress[a[idx].file]=true;save();if(idx<a.length-1){idx++;showWord()}else missionReview(mission)}
function missionReview(n){mission=n;nav('play');reviewItems=shuffle(pool(n));reviewIndex=0;reviewScore=0;reviewMisses=[];showReview()}
function showReview(){nav('play');if(reviewIndex>=reviewItems.length){finishReview();return}const w=reviewItems[reviewIndex];reviewAnswered=false;let choices=shuffle([w,...shuffle(pool(mission).filter(x=>x.file!==w.file&&x.en!==w.en)).slice(0,3)]);app.innerHTML=`<button class="back" onclick="brief(${mission})">← Mission briefing</button><div class="panel"><span class="pill">Mission ${mission} review · ${reviewIndex+1}/10</span><div class="progress"><div style="width:${reviewIndex*10}%"></div></div><h2>Which picture matches?</h2><h2 class="word">${escapeHtml(w.es)}</h2><button class="secondary" onclick="speakByFile('${w.file}')">🔊 Hear Spanish</button><div class="grid" style="margin-top:12px">${choices.map(x=>`<button class="choice" data-answer="${x.file}" onclick="answerReview(this)">${art(x,'quiz-art')}<span>${escapeHtml(x.en)}</span></button>`).join('')}</div><p id="speechStatus" class="status" aria-live="polite"></p><p id="feedback" aria-live="polite"></p><button id="continue" class="btn" style="display:none" onclick="reviewIndex++;showReview()">Next question →</button></div>`}
function answerReview(el){if(reviewAnswered)return;reviewAnswered=true;let w=reviewItems[reviewIndex],ok=el.dataset.answer===w.file;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.answer===w.file)b.classList.add('correct')});if(ok){reviewScore++;progress[w.file]=true;save()}else{el.classList.add('wrong');reviewMisses.push(w);missed[w.file]=(missed[w.file]||0)+1;persist()}document.getElementById('feedback').textContent=ok?'¡Muy bien! ⭐':'Good try! The green picture is correct.';document.getElementById('continue').style.display='inline-block';speak(w.es)}
function finishReview(){let pass=reviewScore>=7;if(pass){earned[mission]=true;persist()}app.innerHTML=`<div class="intro"><h2>${pass?'¡Misión Cumplida!':'Keep practicing!'} 🎉</h2><div class="sticker">${stickerIcons[mission-1]}</div><h3>${reviewScore} / 10 correct</h3><p>${pass?'You earned Mission '+mission+'’s digital Agent Sticker!':'Earn your sticker by getting at least 7 out of 10. You can try again!'}</p><div class="card-actions"><button class="btn" onclick="missionReview(${mission})">🔁 Review again</button><button class="secondary" onclick="brief(${Math.min(25,mission+1)})">${mission<25?'Next mission →':'Mission map'}</button></div><div class="actions"><button class="secondary" onclick="review()">⭐ Sticker book</button><button class="secondary" onclick="home()">🏠 Missions</button></div></div>${reviewMisses.length?`<div class="panel"><h3>Words to practice</h3>${reviewMisses.map(w=>`<div class="glossary-row">${art(w)}<div><b>${escapeHtml(w.es)}</b><div>${escapeHtml(w.en)}</div></div><button class="secondary" onclick="speakByFile('${w.file}')">🔊</button></div>`).join('')}<p id="speechStatus" class="status"></p></div>`:''}`}
function quiz(m){quizMission=m||null;nav('play');let p=m?pool(m):words;questions=shuffle(p).slice(0,Math.min(10,p.length));qidx=0;quizScore=0;showQuiz()}
function showQuiz(){nav('play');if(qidx>=questions.length){app.innerHTML=`<div class="hero"><h2>🎉 Quiz complete!</h2><p>${quizScore} / ${questions.length} correct</p><div class="actions"><button class="btn" onclick="quiz(${quizMission||'null'})">Play again</button><button class="secondary" onclick="home()">Missions</button></div></div>`;return}let w=questions[qidx];let options=shuffle([w,...shuffle(words.filter(x=>x.file!==w.file&&x.en!==w.en)).slice(0,3)]);answered=false;app.innerHTML=`<div class="panel"><span class="pill">Question ${qidx+1} / ${questions.length} · ${quizScore} correct</span><h2>Which picture matches the Spanish word?</h2><h2 class="word">${escapeHtml(w.es)}</h2><button class="secondary" onclick="speakQuiz()">🔊 Listen</button><div class="grid" style="margin-top:12px">${options.map(x=>`<button class="choice big" data-answer="${x.file}" onclick="choose(this)">${art(x,'quiz-art')}<span>${escapeHtml(x.en)}</span></button>`).join('')}</div><p id="speechStatus" class="status" aria-live="polite"></p><p id="feedback" aria-live="polite"></p><button id="continue" class="btn" style="display:none" onclick="qidx++;showQuiz()">Next →</button></div>`}
function choose(el){if(answered)return;const w=questions[qidx],correct=w.file;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.answer===correct)b.classList.add('correct')});let ok=el.dataset.answer===correct;if(!ok){el.classList.add('wrong');missed[correct]=(missed[correct]||0)+1;persist()}else{quizScore++;progress[correct]=true;save()}speak(w.es);document.getElementById('feedback').textContent=ok?'¡Muy bien! ⭐':'Good try! The green answer is correct.';document.getElementById('continue').style.display='inline-block'}
function review(){nav('review');let done=words.filter(w=>progress[w.file]).length;app.innerHTML=`<div class="hero"><h2>⭐ My Agent Sticker Book</h2><p>${done}/250 words explored · ${Object.keys(earned).filter(k=>earned[k]).length}/25 stickers earned</p><p>Complete a mission review with at least 7 correct answers to earn its sticker.</p></div><div class="grid">${Array.from({length:25},(_,i)=>`<button class="tile" onclick="brief(${i+1})"><div class="sticker" style="filter:${earned[i+1]?'none':'grayscale(1)'};opacity:${earned[i+1]?'1':'.35'}">${stickerIcons[i]}</div><h3>Mission ${i+1}</h3><span class="caption">${earned[i+1]?'Earned!':'Not earned yet'}</span></button>`).join('')}</div><div class="panel"><h3>Practice again</h3><div class="actions"><button class="btn" onclick="quiz()">🎮 Mixed quiz</button><button class="secondary" onclick="practiceMisses()">🔁 Practice missed words</button></div></div>`}
function practiceMisses(){let p=words.filter(w=>missed[w.file]>0);if(!p.length){app.innerHTML='<div class="panel"><h2>No missed words yet!</h2><button class="btn" onclick="quiz()">Try a quiz</button></div>';return}nav('play');questions=shuffle(p).slice(0,10);qidx=0;quizScore=0;quizMission=null;showQuiz()}
function glossary(){nav('glossary');app.innerHTML=`<div class="hero"><h2>📖 My Spanish Dictionary</h2><p>All 250 words. Search, listen, and save favorites.</p></div><div class="panel"><label for="glossarySearch">Search in Spanish or English</label><input id="glossarySearch" placeholder="Try perro, dog, apple..." value="${escapeHtml(glossaryTerm)}" oninput="glossaryTerm=this.value;renderGlossaryRows()"><label for="missionFilter" class="small">Filter by mission</label><select id="missionFilter" onchange="glossaryMission=Number(this.value);renderGlossaryRows()" style="padding:12px;width:100%;border-radius:12px;border:1px solid #ccd3ee"><option value="0">All missions</option>${Array.from({length:25},(_,i)=>`<option value="${i+1}" ${glossaryMission===i+1?'selected':''}>${i+1}. ${escapeHtml(pool(i+1)[0].titleEN)}</option>`).join('')}<option value="-1" ${glossaryMission===-1?'selected':''}>My favorites</option></select><div id="glossaryResults"></div><p id="speechStatus" class="status" aria-live="polite"></p></div>`;renderGlossaryRows()}
function renderGlossaryRows(){const t=glossaryTerm.trim().toLowerCase();let a=words.filter(w=>(!t||(w.es+' '+w.en).toLowerCase().includes(t))&&(glossaryMission===0||glossaryMission===-1&&favorites[w.file]||w.mission===glossaryMission)).sort((a,b)=>a.es.localeCompare(b.es,'es'));const el=document.getElementById('glossaryResults');if(!el)return;el.innerHTML=`<p class="caption">${a.length} word${a.length===1?'':'s'} found</p>`+a.map(w=>`<div class="glossary-row">${art(w)}<div style="flex:1"><b>${escapeHtml(w.es)}</b><div class="small">${escapeHtml(w.en)} · ${escapeHtml(w.pron)}</div><div class="caption">Mission ${w.mission}</div></div><button class="secondary" onclick="speakByFile('${w.file}')" aria-label="Hear ${escapeHtml(w.es)}">🔊</button><button class="secondary" onclick="toggleFavorite('${w.file}');renderGlossaryRows()" aria-label="Toggle favorite">${favorites[w.file]?'♥':'♡'}</button></div>`).join('')}
function about(){nav('about');app.innerHTML=`<div class="intro"><h2>¡Hola! How to Play</h2><p>250 everyday Spanish words · 25 playful missions · Ages 5–9</p><div style="font-size:48px">👀 🔊 🗣️ 🎮 ⭐</div><p><b>LOOK</b> at the pictures. <b>LISTEN</b> to Spanish. <b>SAY</b> the words aloud. <b>PLAY</b> the review. <b>EARN</b> your sticker!</p><button class="btn" onclick="home()">Go to Mission Map</button></div><div class="panel"><h3>For Parents & Teachers</h3><p>Try 10–15 minutes at a time. Practice together, repeat tricky words, and celebrate effort. Speech depends on the Spanish voices available on the device. Audio playback requires a tap.</p><h3>About images and privacy</h3><p>Default images are emoji-style placeholders. You can replace them with your own images using the matching filenames in the image inventory. The app stores progress on this device; no account is required.</p><p class="caption">© 2026. Educational prototype. Artwork, wording, pronunciation, and rights should be reviewed before commercial publication.</p></div>`}

const alphaLetters='ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('');
const alphaExamples=[['Árbol','🌳'],['Barco','⛵'],['Casa','🏠'],['Dedo','☝️'],['Elefante','🐘'],['Flor','🌸'],['Gato','🐈'],['Helado','🍦'],['Isla','🏝️'],['Jirafa','🦒'],['Kiwi','🥝'],['Luna','🌙'],['Manzana','🍎'],['Nube','☁️'],['Ñandú','🐦'],['Oso','🐻'],['Perro','🐕'],['Queso','🧀'],['Ratón','🐭'],['Sol','☀️'],['Tortuga','🐢'],['Uva','🍇'],['Vaca','🐄'],['Wafle','🧇'],['Xilófono','🎼'],['Yate','⛵'],['Zapato','👟']];
const alphaNames=['a','be','ce','de','e','efe','ge','hache','i','jota','ka','ele','eme','ene','eñe','o','pe','cu','erre','ese','te','u','uve','uve doble','equis','ye','zeta'];
let alphaIndex=0,alphaQ=0,alphaScore=0,alphaChoices=[];
function alphabet(){nav('alphabet');app.innerHTML=`<div class="hero cozy-hero"><span class="pill">🌼 Alphabet Academy</span><h2>Mi Abecedario</h2><p>27 friendly letters, little sounds, and picture friends. Tap a letter to explore!</p><div class="cozy-garden">🌷 🐻 🦋 🌼 🐰</div></div><div class="panel"><div class="alpha-grid">${alphaLetters.map((c,i)=>`<button class="alpha-letter ${i===alphaIndex?'selected':''}" onclick="alphaSelect(${i})" aria-label="Explore letter ${c}">${c}</button>`).join('')}</div><div id="alphaDetail"></div></div><div class="panel"><h3>🎲 Letter Garden Game</h3><p>Listen to a letter, then find it in the garden!</p><button class="btn" onclick="alphaGame()">Play Find the Letter →</button></div>`;alphaDetail()}
function alphaSelect(i){alphaIndex=i;alphabet()}
function alphaDetail(){let l=alphaLetters[alphaIndex],ex=alphaExamples[alphaIndex];let el=document.getElementById('alphaDetail');if(!el)return;el.innerHTML=`<div class="alpha-preview"><div class="letter">${l} ${l.toLocaleLowerCase('es')}</div><div class="example">${ex[1]}</div><h2>${ex[0]}</h2><p>Letter ${alphaIndex+1} of 27</p><div class="actions" style="justify-content:center"><button class="btn" onclick="speak(alphaNames[${alphaIndex}])">🔊 Hear letter</button><button class="secondary" onclick="speak(alphaExamples[${alphaIndex}][0])">🔊 Hear word</button></div><p id="speechStatus" class="status" aria-live="polite"></p></div><div class="actions"><button class="secondary" onclick="alphaSelect(${(alphaIndex+26)%27})">← Previous</button><button class="orange" onclick="alphaSelect(${(alphaIndex+1)%27})">Next letter →</button></div>`}
function alphaGame(){nav('alphabet');alphaQ=0;alphaScore=0;alphaQuestion()}
function alphaQuestion(){if(alphaQ>=10){app.innerHTML=`<div class="intro cozy-hero"><h2>🌸 ¡Muy bien!</h2><div class="cozy-garden">🐻 ⭐ 🐰</div><p>You found ${alphaScore} out of 10 letters!</p><button class="btn" onclick="alphaGame()">Play again</button><button class="secondary" onclick="alphabet()">Alphabet garden</button></div>`;return}let target=Math.floor(Math.random()*27);let opts=[target];while(opts.length<4){let n=Math.floor(Math.random()*27);if(!opts.includes(n))opts.push(n)}opts.sort(()=>Math.random()-.5);alphaChoices=[target,opts];app.innerHTML=`<div class="panel"><span class="pill">🌼 Letter Garden · ${alphaQ+1}/10</span><h2>Listen, then find the letter!</h2><button class="btn" onclick="speak(alphaNames[alphaChoices[0]])">🔊 Hear the letter</button><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:16px">${opts.map(i=>`<button class="choice big" style="font-size:34px" onclick="alphaAnswer(${i},this)">${alphaLetters[i]}</button>`).join('')}</div><p id="speechStatus" class="status" aria-live="polite"></p><p id="feedback" aria-live="polite"></p><button id="continue" class="btn" style="display:none" onclick="alphaQ++;alphaQuestion()">Next letter →</button></div>`}
function alphaAnswer(i,el){let [target]=alphaChoices;if(document.getElementById('continue').style.display!=='none')return;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(i===target){alphaScore++;el.classList.add('correct');document.getElementById('feedback').textContent='¡Muy bien! 🌟'}else{el.classList.add('wrong');document.getElementById('feedback').textContent='Nice try! The letter was '+alphaLetters[target]}document.getElementById('continue').style.display='inline-block';speak(alphaNames[target])}
const cozyOldHome=home;home=function(){cozyOldHome();const hero=app.querySelector('.hero');if(hero){hero.classList.add('cozy-hero');hero.insertAdjacentHTML('beforeend',`<div class="cozy-garden" aria-hidden="true">🐻 🌷 🐰 🦋 🌼</div><button class="secondary" onclick="alphabet()">🔤 Visit Alphabet Academy</button>`)} };
const cozyOldWelcome=welcome;welcome=function(){cozyOldWelcome();const intro=app.querySelector('.intro');if(intro){intro.classList.add('cozy-hero');intro.insertAdjacentHTML('afterbegin','<div class="cozy-garden" aria-hidden="true">🌼 🐰 🌷 🐻 🦋</div>');}}

fetch('./words.json').then(r=>{if(!r.ok)throw Error('Vocabulary file missing');return r.json()}).then(d=>{words=d;if(!localStorage.getItem('spanish-agent-welcomed'))welcome();else home();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}).catch(e=>app.textContent='Could not load words.json. Open the app from a web server (such as GitHub Pages), not directly as a file. '+e.message);
</script></body></html>

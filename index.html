<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#866A9E"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Spanish Agent Adventure — Cozy Treasure Trails</title><style>
:root{font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:#554760;background:#FFF9EF}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#FFF7EA,#F8F0FC 50%,#ECF6EC);min-height:100vh}button{font:inherit;cursor:pointer;border:0;touch-action:manipulation;min-height:46px}button:focus-visible{outline:3px solid #A87EBE;outline-offset:2px}header{background:#FFFAF3;border-bottom:2px solid #F0DFD6;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:2}header strong{font-size:clamp(16px,3vw,22px);color:#72598C}main{max-width:900px;margin:0 auto;padding:16px 14px 50px}.card{background:#FFFEFA;border:2px solid #EADDD7;border-radius:24px;padding:20px;margin:12px 0;box-shadow:0 6px 20px #71546d12}.hero{background:linear-gradient(135deg,#FCEBD9,#F4E7F8,#E5F5E7);text-align:center}.muted{color:#786B7D}.pill{display:inline-block;background:#F4E6F6;border-radius:30px;padding:6px 12px;font-size:12px;font-weight:700}h1,h2,h3{color:#70578B}h1{font-size:clamp(26px,5vw,36px)}h2{font-size:clamp(21px,4vw,29px)}.btn{background:#8B70A8;color:white;border-radius:16px;padding:12px 18px;font-weight:700;box-shadow:0 3px 0 #6d5489}.alt{background:#E7F1E4;color:#4B7058;box-shadow:none}.peach{background:#F9E3CD;color:#815D46;box-shadow:none}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mission{background:#fff;border:2px solid #E8DBE5;border-radius:20px;padding:15px;text-align:left;color:#604E6B}.mission .big{font-size:32px}.mission small{display:block;color:#807587;margin-top:6px}.bonus{background:#F2EBFA}.map-wrap{border:2px solid #E2D7C5;border-radius:24px;overflow:hidden;background:#F3F6E8}.map-wrap svg{width:100%;display:block;max-height:650px}.stop-buttons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:14px 0}.stop-buttons button{border-radius:14px;background:#F5EAF8;color:#674F83}.stop-buttons button.done{background:#D9F1D9;color:#316345}.art{font-size:clamp(70px,17vw,115px);background:radial-gradient(circle,#FFF3DA,#E8F4EA);padding:25px;border-radius:25px;text-align:center;min-height:180px}.art img{max-height:180px;max-width:100%;object-fit:contain}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choices button{background:#F3ECF8;color:#634C78;border-radius:15px;padding:14px}.choices button.good{background:#D8F0DA}.choices button.bad{background:#FFE1D9}.stamp{font-size:75px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{background:#F4E7EE;color:#725B84;padding:8px 12px;border-radius:14px}.detail{background:#F8F4FA;border-radius:18px;padding:15px}input{padding:12px;border:2px solid #E4D6E9;border-radius:14px;font:inherit;width:100%}.tiny{font-size:12px}.status{min-height:20px;font-size:13px;color:#795C83}.map-note{text-align:center;padding:10px;color:#6F6A78}.full{width:100%}.hidden{display:none}@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:25px}}@media(max-width:440px){header strong{font-size:15px}.card{padding:15px}.stop-buttons{gap:4px}.stop-buttons button{padding:3px;min-height:44px}}
</style></head><body><header><strong>🌷 Spanish Agent Adventure <span class="tiny" id="versionTag"></span></strong><button class="btn alt" onclick="developer()" aria-label="Developer Information">⚙️ Info</button></header><main id="app"><div class="card">Loading your cozy adventure…</div></main><script>
const RELEASE={"app": "Spanish Agent Adventure", "version": "6.0.0", "build": "20261030214949", "builtAtUTC": "2026-10-30T21:49:49Z", "curriculumVersion": "24x10-1", "artworkInventoryVersion": "6.0.0", "cacheVersion": "spanish-agent-v6-20261030214949", "releaseId": "SAA-20261030214949"};let missions=[],legacy=[],active=1,stop=0,reviewAt=0,reviewScore=0,reviewOrder=[],reviewLocked=false,reviewType='picture',selectedLeft=null;const app=document.getElementById('app');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key='spanish-agent-v6-progress';let state={visited:{},stamps:{},mistakes:{}};try{state={...state,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{}function save(){localStorage.setItem(key,JSON.stringify(state))}const item=(m,i)=>missions[m-1].stops[i];const say=(text)=>{const status=document.getElementById('speechStatus');if(!('speechSynthesis' in window)){if(status)status.textContent='Speech unavailable in this browser';return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=.78;const voices=speechSynthesis.getVoices();const voice=voices.find(v=>/^es[-_]/i.test(v.lang));if(voice)u.voice=voice;u.onstart=()=>{if(status)status.textContent='🔊 Playing Spanish…'};u.onend=()=>{if(status)status.textContent='✓ Finished'};u.onerror=e=>{if(status)status.textContent='Audio issue: '+e.error+'; check device volume and Spanish voice settings'};if(status)status.textContent='Starting Spanish audio…';speechSynthesis.speak(u)}catch(e){if(status)status.textContent=e.message}};
function art(w){if(w.originalFile){const f=w.originalFile,base=f.replace(/\.[^.]+$/,'');return '<img src="images/custom/'+safe(f)+'" data-fallback="images/defaults/'+safe(base)+'.svg" alt="'+safe(w.en)+'" onerror="this.onerror=null;this.src=this.dataset.fallback">'}return '<span role="img" aria-label="'+safe(w.en)+'">'+safe(w.emoji)+'</span>'}
function top(title,subtitle=''){return '<div class="card hero"><h1>'+title+'</h1><p>'+subtitle+'</p></div>'}function home(){let got=Object.keys(state.stamps).filter(k=>state.stamps[k]).length;app.innerHTML=top('🗺️ Your Cozy Treasure Trails','24 little adventures · 3 bonuses · 5 magical map styles')+'<div class="card"><b>'+got+' / 24 treasure stamps collected</b><p class="muted">Tap a mission to explore ten stops, then open its treasure chest after a gentle review.</p><div class="row"><button class="btn alt" onclick="bonus(1)">🔤 Alphabet Academy</button><button class="btn alt" onclick="glossary()">📚 Dictionary</button></div></div><div class="grid">'+missions.map(m=>'<button class="mission" onclick="map('+m.id+')"><span class="big">'+m.icon+'</span><span class="pill">Mission '+m.id+'</span><h3>'+safe(m.title)+'</h3><small>'+m.stops.filter(s=>state.visited[s.id]).length+'/10 discoveries · '+(state.stamps[m.id]?'🏆 Treasure earned':'🔒 Treasure awaits')+'</small></button>').join('')+'</div><div class="card bonus"><h2>🎁 Bonus Adventures</h2><div class="row"><button class="btn" onclick="bonus(1)">Bonus 1: Alphabet</button><button class="btn" onclick="bonus(2)">Bonus 2: Story Studio</button><button class="btn" onclick="bonus(3)">Bonus 3: Treasure Island</button></div></div>'}
const themes=[{name:'Enchanted Garden',bg:'#E8F4DD',path:'#D3AD85',deco:['🌸','🦋','🌼','🌷','🐝']},{name:'Floating Islands',bg:'#E5F3FB',path:'#AFC9D6',deco:['☁️','🌈','🪁','🕊️','☀️']},{name:'Winding River',bg:'#DFF2E9',path:'#8BC8CC',deco:['🪷','🐸','🦆','🌿','🐟']},{name:'Woodland Trail',bg:'#F1ECD9',path:'#C9AD82',deco:['🍄','🌲','🦊','🍂','🐿️']},{name:'Starry Sky',bg:'#E9E2F8',path:'#C2ADD8',deco:['⭐','🌙','✨','☁️','🌟']}];
function map(n){active=n;let m=missions[n-1],t=themes[m.theme],visited=m.stops.filter(s=>state.visited[s.id]).length;let coords=m.stops.map((s,i)=>({x:i%2?70:30,y:55+i*52}));let path=coords.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ');let svg='<svg viewBox="0 0 100 645" role="img" aria-label="'+safe(t.name)+' treasure map with ten stops"><rect width="100" height="645" rx="5" fill="'+t.bg+'"/><path d="'+path+'" fill="none" stroke="'+t.path+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 11"/>';for(let i=0;i<10;i++){let p=coords[i];svg+='<circle cx="'+p.x+'" cy="'+p.y+'" r="16" fill="'+(state.visited[m.stops[i].id]?'#B5DAB9':'#FFFDF6')+'" stroke="#9B8BA0" stroke-width="1.2"/><text x="'+p.x+'" y="'+(p.y+4)+'" font-size="11" text-anchor="middle" font-weight="bold" fill="#675879">'+(state.visited[m.stops[i].id]?'✓':i+1)+'</text><text x="'+(p.x<50?56:14)+'" y="'+(p.y+2)+'" font-size="8" text-anchor="'+(p.x<50?'start':'end')+'">'+t.deco[i%5]+'</text>'}svg+='<text x="50" y="610" text-anchor="middle" font-size="28">🎁</text></svg>';app.innerHTML='<div class="row between"><button class="btn alt" onclick="home()">← All missions</button><span class="pill">'+visited+'/10 discovered</span></div>'+top(m.icon+' Mission '+n+': '+safe(m.title),t.name+' · Follow the path from 1 to 10')+'<div class="map-wrap">'+svg+'</div><p class="map-note">Choose a numbered stop below. Complete all ten to open your treasure.</p><div class="stop-buttons">'+m.stops.map((s,i)=>'<button class="'+(state.visited[s.id]?'done':'')+'" onclick="learn('+i+')">'+(state.visited[s.id]?'✓ ':'' )+(i+1)+'</button>').join('')+'</div><div class="card"><h3>🎁 Treasure chest</h3><p>'+(state.stamps[n]?'🏅 Stamp collected!':visited===10?'Your treasure is ready! Play the review to unlock it.':'Explore all ten stops, then play a short review to earn your stamp.')+'</p><button class="btn" '+(visited!==10?'disabled style="opacity:.5"':'')+' onclick="reviewStart()">⭐ '+(state.stamps[n]?'Replay':'Open')+' treasure review</button></div>'}
function learn(i){stop=i;let w=item(active,i);app.innerHTML='<button class="btn alt" onclick="map('+active+')">← Treasure map</button><div class="card"><span class="pill">Stop '+(i+1)+' of 10</span><h2>'+safe(w.es)+'</h2><div class="art">'+art(w)+'</div><h2>'+safe(w.en)+'</h2><p class="muted">'+(w.scene==='phrase'?'A phrase to use in everyday life. Talk about the situation together.':'Look at the picture and say the Spanish word.')+'</p><div class="row"><button class="btn" onclick="say(item(active,stop).es)">🔊 Hear Spanish</button><button class="btn peach" onclick="say(item(active,stop).es)">🔁 Repeat</button></div><p id="speechStatus" class="status" aria-live="polite"></p><div class="row"><button class="btn alt" onclick="learn(Math.max(0,stop-1))">← Back</button><button class="btn" onclick="completeStop()">✓ I explored this!</button></div></div>'}
function completeStop(){state.visited[item(active,stop).id]=true;save();if(stop<9)learn(stop+1);else map(active)}
function reviewStart(){reviewOrder=[...missions[active-1].stops].sort(()=>Math.random()-.5);reviewAt=0;reviewScore=0;reviewType='picture';reviewQuestion()}
function reviewQuestion(){if(reviewAt>=10){state.stamps[active]=true;save();app.innerHTML=top('🏆 Treasure found!','You earned the cozy mission stamp!')+'<div class="card" style="text-align:center"><div class="stamp">'+missions[active-1].icon+'🏅</div><h2>'+safe(missions[active-1].title)+'</h2><p>'+reviewScore+' / 10 correct. Every effort counts!</p><div class="row"><button class="btn" onclick="map('+active+')">See treasure map</button><button class="btn alt" onclick="home()">All missions</button></div></div>';return}reviewLocked=false;let w=reviewOrder[reviewAt],opts=[w,...missions[active-1].stops.filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);app.innerHTML='<div class="card"><span class="pill">Treasure review '+(reviewAt+1)+'/10</span><h2>Which picture or meaning matches?</h2><h2>'+safe(w.es)+'</h2><button class="btn alt" onclick="say(reviewOrder[reviewAt].es)">🔊 Listen</button><div class="choices" style="margin-top:14px">'+opts.map(x=>'<button data-id="'+x.id+'" onclick="reviewAnswer(this)"><div style="font-size:34px">'+safe(x.emoji)+'</div>'+safe(x.en)+'</button>').join('')+'</div><p id="feedback" class="status" aria-live="polite"></p><p id="speechStatus" class="status"></p><button id="nextQ" class="btn hidden" onclick="reviewAt++;reviewQuestion()">Next →</button></div>'}
function reviewAnswer(el){if(reviewLocked)return;reviewLocked=true;let w=reviewOrder[reviewAt],ok=el.dataset.id===w.id;if(ok)reviewScore++;else state.mistakes[w.id]=(state.mistakes[w.id]||0)+1;save();document.querySelectorAll('[data-id]').forEach(b=>{b.disabled=true;if(b.dataset.id===w.id)b.classList.add('good')});if(!ok)el.classList.add('bad');document.getElementById('feedback').textContent=ok?'¡Muy bien! ⭐':'Good try! The green answer is correct.';document.getElementById('nextQ').classList.remove('hidden');say(w.es)}
function bonus(n){if(n===1){app.innerHTML=top('🔤 Bonus 1 — Alphabet Academy','27 letters including Ñ')+'<div class="card"><div class="stop-buttons">'+Array.from('ABCDEFGHIJKLMNÑOPQRSTUVWXYZ').map((c,i)=>'<button onclick="letter('+i+')">'+c+'</button>').join('')+'</div><div id="letterDetail"></div></div>';letter(0);return}if(n===2){app.innerHTML=top('🎨 Bonus 2 — Story Studio','Practice short phrases and invent a little story')+'<div class="card"><h2>Choose a phrase</h2><div class="row">'+missions[0].stops.slice(0,5).map((s,i)=>'<button class="btn alt" onclick="story('+i+')">'+safe(s.es)+'</button>').join('')+'</div><div id="storyResult" class="detail" style="margin-top:12px">Choose a phrase to hear it and imagine a story.</div><p id="speechStatus" class="status"></p></div>';return}app.innerHTML=top('🏝️ Bonus 3 — Treasure Island','A surprise mixed review')+'<div class="card"><p>Choose any completed mission and replay its treasure challenge!</p><div class="row">'+missions.filter(m=>m.stops.every(s=>state.visited[s.id])).map(m=>'<button class="btn alt" onclick="active='+m.id+';reviewStart()">'+m.icon+' '+m.id+'</button>').join('')+'</div><button class="btn alt" onclick="home()">Back home</button></div>'}
const letters='ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('');const ex=['Árbol','Barco','Casa','Dedo','Elefante','Flor','Gato','Helado','Isla','Jirafa','Kiwi','Luna','Manzana','Nube','Ñandú','Oso','Perro','Queso','Ratón','Sol','Tortuga','Uva','Vaca','Wafle','Xilófono','Yate','Zapato'];const names=['a','be','ce','de','e','efe','ge','hache','i','jota','ka','ele','eme','ene','eñe','o','pe','cu','erre','ese','te','u','uve','uve doble','equis','ye','zeta'];function letter(i){document.getElementById('letterDetail').innerHTML='<div class="detail"><h1>'+letters[i]+' '+letters[i].toLocaleLowerCase('es')+'</h1><h2>'+ex[i]+'</h2><div class="row"><button class="btn" onclick="say(names['+i+'])">🔊 Letter name</button><button class="btn alt" onclick="say(ex['+i+'])">🔊 Example word</button></div><p id="speechStatus" class="status"></p></div>'}function story(i){let s=missions[0].stops[i];document.getElementById('storyResult').innerHTML='<h2>'+safe(s.es)+'</h2><div class="art">'+s.emoji+'</div><p>'+safe(s.en)+'</p><button class="btn" onclick="say(missions[0].stops['+i+'].es)">🔊 Listen</button>'}
function glossary(){let all=[...missions.flatMap(m=>m.stops),...legacy.map(w=>({es:w.es,en:w.en,emoji:'📖',originalFile:w.file}))];window.dict=all;app.innerHTML=top('📚 Spanish Dictionary','Search the new lessons and original 250-word collection')+'<div class="card"><input id="search" placeholder="Search Spanish or English" oninput="dictRows()" aria-label="Search dictionary"><div id="dictResults"></div><p id="speechStatus" class="status"></p></div>';dictRows()}function dictRows(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('dictResults').innerHTML=window.dict.filter(w=>(w.es+' '+w.en).toLowerCase().includes(q)).slice(0,75).map(w=>'<div class="row" style="padding:8px;border-bottom:1px solid #eee"><span>'+safe(w.emoji)+'</span><b>'+safe(w.es)+'</b><span>'+safe(w.en)+'</span><button class="btn alt" onclick="say('+JSON.stringify(w.es).replace(/"/g,'&quot;')+')">🔊</button></div>').join('')}
function copyDiagnostics(){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(window.diagnosticReport).then(()=>alert('Copied diagnostic report')).catch(()=>alert(window.diagnosticReport))}else alert(window.diagnosticReport)}
async function developer(){let reg=await navigator.serviceWorker?.getRegistration().catch(()=>null);let cacheNames=await caches.keys().catch(()=>[]);let online='Unknown';try{let r=await fetch('./release.json?check='+Date.now(),{cache:'no-store'});if(r.ok){let latest=await r.json();online=latest.build===RELEASE.build?'Current build matches server':'Server build: '+latest.build+' (running '+RELEASE.build+')'}}catch{online='Cannot check server (offline?)'}let report=['Spanish Agent Adventure diagnostics','Version: '+RELEASE.version,'Build: '+RELEASE.build,'Build UTC: '+RELEASE.builtAtUTC,'Release ID: '+RELEASE.releaseId,'Curriculum: '+RELEASE.curriculumVersion,'Artwork: '+RELEASE.artworkInventoryVersion,'Cache expected: '+RELEASE.cacheVersion,'Cache actual: '+cacheNames.join(', '),'Service worker: '+(reg?.active?.scriptURL||'Not active'),'Server check: '+online,'Browser: '+navigator.userAgent].join('\n');window.diagnosticReport=report;app.innerHTML=top('⚙️ Developer Information','For parents and release troubleshooting')+'<div class="card"><h2>Running version '+RELEASE.version+'</h2><p><b>Build:</b> '+RELEASE.build+'</p><p><b>Built UTC:</b> '+RELEASE.builtAtUTC+'</p><p><b>Release ID:</b> '+RELEASE.releaseId+'</p><p><b>Curriculum:</b> '+RELEASE.curriculumVersion+'</p><p><b>Artwork:</b> '+RELEASE.artworkInventoryVersion+'</p><p><b>Expected cache:</b> '+RELEASE.cacheVersion+'</p><p><b>Installed caches:</b> '+safe(cacheNames.join(', '))+'</p><p><b>Service worker:</b> '+safe(reg?.active?.scriptURL||'Not active')+'</p><p><b>Latest server check:</b> '+safe(online)+'</p><div class="row"><button class="btn" onclick="copyDiagnostics()">📋 Copy diagnostics</button><button class="btn alt" onclick="location.reload()">↻ Refresh app</button><button class="btn alt" onclick="home()">← Home</button></div><p class="tiny">Refreshing does not delete saved progress. A newer release may require a second refresh after the service worker updates.</p></div>'}
Promise.all([fetch('./curriculum.json').then(r=>r.json()),fetch('./words.json').then(r=>r.json())]).then(([a,b])=>{missions=a;legacy=b;document.getElementById('versionTag').textContent='v'+RELEASE.version;home();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}).catch(e=>app.innerHTML='<div class="card">Unable to load the curriculum. Deploy the app to a web server. '+safe(e.message)+'</div>');
</script></body></html>

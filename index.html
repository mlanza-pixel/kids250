<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#334cbd"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Spanish Agent Adventure</title><style>
:root{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#263568;background:#fff9ed}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;min-height:48px;border:0;border-radius:20px;padding:12px 18px;font-weight:800}button:focus-visible{outline:3px solid #ee7d41}header{background:#334cbd;color:white;padding:20px 18px 16px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:clamp(25px,5vw,39px)}header p{margin:4px 0 0;color:#e4e8ff}main{max-width:940px;margin:auto;padding:18px 14px 110px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;background:#fffef9;border-top:1px solid #e7e1d7;padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:10}.nav button{font-size:13px;padding:8px;flex:1;max-width:170px;background:#eff0ff;color:#303e9d}.nav button.active{background:#334cbd;color:white}.hero{background:#ffdf79;border-radius:30px;padding:22px;margin:6px 0 20px}.hero h2{font-size:30px;margin:5px 0}.muted{color:#68718b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.tile,.panel{background:white;border-radius:26px;padding:18px;box-shadow:0 4px 15px #34436b12}.tile{border:2px solid #eef0f9;text-align:left;color:#263568}.tile h3{margin:7px 0}.pill{background:#eef1ff;color:#3645a2;padding:5px 10px;border-radius:30px;display:inline-block;font-size:12px;font-weight:800}.btn{background:#334cbd;color:white}.secondary{background:#eef0ff;color:#334cbd}.orange{background:#ff865b;color:#3c2740}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.word{font-size:clamp(34px,7vw,52px);margin:8px 0}.pic{font-size:clamp(80px,20vw,150px);display:flex;align-items:center;justify-content:center;min-height:205px;background:#e9f5fb;border-radius:24px;margin:12px 0}.word-art{display:block;max-width:100%;width:100%;height:100%;object-fit:contain;border-radius:20px}.quiz-art{height:116px;object-fit:contain;margin-bottom:7px}.pic small{font-size:14px;color:#6b7a91}.sentence{font-size:20px;line-height:1.5}.progress{height:13px;border-radius:20px;background:#e6e9f5;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#4ebd99;transition:width .2s}.choice{width:100%;margin:6px 0;text-align:left;background:#f0f2ff;color:#243568;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;text-align:center}.choice.correct{border-color:#36a77a;background:#e4f9ec}.choice.wrong{border-color:#e77b6a;background:#fff0ed}.big{font-size:22px}.back{background:transparent;color:#334cbd;padding-left:0}input{font:inherit;padding:14px;border:2px solid #d9def7;border-radius:15px;max-width:100%;width:100%}.caption{font-size:13px;color:#67718a}h2{margin:10px 0 15px}@media(min-width:650px){.pic{min-height:250px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><header><h1>🌟 Spanish Agent Adventure</h1><p>250 words · 25 missions · Ages 5–9 · Version 2.0</p></header><main id="app" aria-live="polite">Loading missions…</main><nav class="nav"><button id="homeNav" onclick="home()">🏠 Missions</button><button id="playNav" onclick="quiz()">🎮 Play</button><button id="reviewNav" onclick="review()">⭐ Stars</button></nav><script>
let words=[],mission=1,idx=0,mode='home',qidx=0,questions=[],answered=false;const app=document.getElementById('app');let progress={};try{progress=JSON.parse(localStorage.getItem('spanish-agent-progress')||'{}')}catch{}const save=()=>{try{localStorage.setItem('spanish-agent-progress',JSON.stringify(progress))}catch{}};
const escapeHtml=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={'dog':'🐕','cat':'🐈','fish':'🐟','bird':'🐦','rabbit':'🐇','hamster':'🐹','turtle':'🐢','horse':'🐎','parrot':'🦜','guinea pig':'🐹','cow':'🐄','pig':'🐖','sheep':'🐑','hen':'🐔','duck':'🦆','goose':'🪿','goat':'🐐','donkey':'🫏','rooster':'🐓','mule':'🐴','lion':'🦁','tiger':'🐅','monkey':'🐒','elephant':'🐘','giraffe':'🦒','zebra':'🦓','bear':'🐻','wolf':'🐺','fox':'🦊','panda':'🐼','shark':'🦈','whale':'🐋','dolphin':'🐬','octopus':'🐙','crab':'🦀','starfish':'⭐','seal':'🦭','penguin':'🐧','jellyfish':'🪼','shrimp':'🦐','butterfly':'🦋','bee':'🐝','ant':'🐜','fly':'🪰','mosquito':'🦟','spider':'🕷️','beetle':'🐞','grasshopper':'🦗','cricket':'🦗','centipede':'🐛','apple':'🍎','banana':'🍌','orange':'🍊','grapes':'🍇','strawberry':'🍓','watermelon':'🍉','melon':'🍈','pineapple':'🍍','pear':'🍐','lemon':'🍋','carrot':'🥕','tomato':'🍅','lettuce':'🥬','onion':'🧅','garlic':'🧄','broccoli':'🥦','potato':'🥔','cucumber':'🥒','corn':'🌽','chili pepper':'🌶️','milk':'🥛','water':'💧','juice':'🧃','cake':'🎂','cookie':'🍪','ice cream':'🍦','chocolate':'🍫','candy':'🍬','bread':'🍞','cheese':'🧀','egg':'🥚','bacon':'🥓','cereal':'🥣','oatmeal':'🥣','yogurt':'🥛','honey':'🍯','butter':'🧈','tea':'🍵','cup':'☕','plate':'🍽️','bed':'🛏️','pillow':'🛌','blanket':'🧣','clock':'⏰','lamp':'💡','door':'🚪','window':'🪟','closet':'🚪','rug':'🟪','mirror':'🪞','table':'🪑','chair':'🪑','spoon':'🥄','fork':'🍴','knife':'🔪','glass':'🥛','bowl':'🥣','pot':'🍲','pan':'🍳','fridge':'🧊','soap':'🧼','towel':'🧻','brush':'🪥','toothpaste':'🪥','shower':'🚿','bathtub':'🛁','toilet':'🚽','paper':'🧻','sink':'🚰','dryer':'💨','sofa':'🛋️','tv':'📺','book':'📖','ball':'⚽','doll':'🪆','toy car':'🚗','block':'🧱','puzzle':'🧩','crayon':'🖍️','playdough':'🎨','shirt':'👕','pants':'👖','dress':'👗','skirt':'👗','shorts':'🩳','coat':'🧥','sweater':'🧶','socks':'🧦','cap':'🧢','scarf':'🧣','shoe':'👞','boot':'🥾','sandal':'🩴','backpack':'🎒','bag':'👜','keys':'🔑','glasses':'👓','ring':'💍','necklace':'📿','bracelet':'📿','car':'🚗','truck':'🛻','bus':'🚌','taxi':'🚕','motorcycle':'🏍️','wheel':'🛞','steering wheel':'🚘','engine':'⚙️','gas':'⛽','tire':'🛞','train':'🚆','boat':'⛵','airplane':'✈️','helicopter':'🚁','rocket':'🚀','submarine':'🚢','sailboat':'⛵','canoe':'🛶','balloon':'🎈','runway':'🛫','bicycle':'🚲','skateboard':'🛹','roller skates':'🛼','tricycle':'🚲','helmet':'🪖','ramp':'🛹','brake':'🚲','pedal':'🚲','chain':'⛓️','bell':'🔔','swing':'🛝','slide':'🛝','sandbox':'🏖️','fountain':'⛲','bench':'🪑','grass':'🌱','flower':'🌸','path':'🛤️','fence':'🪵','gate':'🚪','sand':'🏖️','wave':'🌊','seashell':'🐚','sun':'☀️','beach umbrella':'🏖️','castle':'🏰','bucket':'🪣','shovel':'🪏','net':'🥅','snail':'🐌','tree':'🌳','leaf':'🍃','branch':'🌿','trunk':'🌳','root':'🌱','forest':'🌲','mountain':'🏔️','river':'🏞️','lake':'🏞️','rock':'🪨','day':'☀️','moon':'🌕','cloud':'☁️','rain':'🌧️','snow':'❄️','wind':'💨','storm':'⛈️','rainbow':'🌈','cold':'🥶','heat':'🥵','school':'🏫','pencil':'✏️','eraser':'🧽'};
function art(w,cls=''){const base=w.file.replace(/\.[^.]+$/,'');return `<img class="word-art ${cls}" src="images/custom/${escapeHtml(w.file)}" data-default="images/defaults/${escapeHtml(base)}.svg" alt="${escapeHtml(w.en)}" onerror="if(this.src.indexOf('/defaults/')===-1){this.src=this.dataset.default}else{this.style.display='none'}">`}function emoji(w){let k=w.en.toLowerCase().replace(/^the\s+/,'').trim();return icons[k]||'🎨'}function speak(t){if(!('speechSynthesis'in window)){alert('Speech is not available in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.77;let vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('es'));if(vs.length)u.voice=vs[0];speechSynthesis.speak(u)}
function nav(n){mode=n;['home','play','review'].forEach(x=>document.getElementById(x+'Nav').classList.toggle('active',x===n))}function home(){nav('home');const done=Object.values(progress).filter(Boolean).length;app.innerHTML=`<div class="hero"><span class="pill">¡Hola, Agent!</span><h2>Your Spanish adventure starts here! 🚀</h2><p>Listen, learn, play, and earn your mission stars.</p><div class="progress"><div style="width:${done/250*100}%"></div></div><b>${done} / 250 words explored</b></div><h2>Choose a mission</h2><div class="grid">${Array.from({length:25},(_,i)=>{let a=words.filter(w=>w.mission===i+1);let count=a.filter(w=>progress[w.file]).length;return `<button class="tile" onclick="start(${i+1})"><span class="pill">Mission ${i+1} · ${count}/10</span><h3>${escapeHtml(a[0]?.titleEN||'Mission')}</h3><div>${escapeHtml(a[0]?.titleES||'')}</div><div class="progress"><div style="width:${count*10}%"></div></div><span class="caption">${count===10?'⭐ Mission complete':'Tap to explore →'}</span></button>`}).join('')}</div>`}
function start(n){mission=n;idx=0;showWord()}function showWord(){nav('home');let a=words.filter(w=>w.mission===mission),w=a[idx];app.innerHTML=`<button class="back" onclick="home()">← All missions</button><div class="panel"><span class="pill">Mission ${mission} · Word ${idx+1} of ${a.length}</span><h2>${escapeHtml(w.titleEN)}</h2><div class="pic" role="img" aria-label="Placeholder for ${escapeHtml(w.en)}">${art(w)}</div><div class="caption">Default illustration · replace by adding your own JPG to images/custom/</div><h2 class="word">${escapeHtml(w.es)}</h2><p class="muted">${escapeHtml(w.pron)} · ${escapeHtml(w.en)}</p><p class="sentence">${escapeHtml(w.sentence)}</p><div class="actions"><button class="btn" onclick="speak(${JSON.stringify(w.es)})">🔊 Hear Spanish</button><button class="secondary" onclick="speak(${JSON.stringify(w.sentence)})">🔊 Hear sentence</button></div><div class="actions"><button class="secondary" onclick="prev()" ${idx===0?'disabled':''}>← Previous</button><button class="orange" onclick="next()">${idx===a.length-1?'⭐ Finish mission':'I learned it! →'}</button></div></div>`}
function prev(){idx=Math.max(0,idx-1);showWord()}function next(){let a=words.filter(w=>w.mission===mission);progress[a[idx].file]=true;save();if(idx<a.length-1){idx++;showWord()}else{app.innerHTML=`<div class="hero"><h2>¡Misión Cumplida! ⭐</h2><p>You completed Mission ${mission}! Great job, Agent.</p><div class="actions"><button class="btn" onclick="quiz(${mission})">🎮 Play mission quiz</button><button class="secondary" onclick="home()">All missions</button></div></div>`}}
function quiz(m){nav('play');let pool=m?words.filter(w=>w.mission===m):words;questions=[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(10,pool.length));qidx=0;showQuiz()}function showQuiz(){nav('play');if(qidx>=questions.length){app.innerHTML=`<div class="hero"><h2>🎉 Quiz complete!</h2><p>You practiced ${questions.length} Spanish words.</p><button class="btn" onclick="quiz()">Play again</button><button class="secondary" onclick="home()">Missions</button></div>`;return}let w=questions[qidx];let options=[w,...words.filter(x=>x.file!==w.file&&x.en!==w.en).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);answered=false;app.innerHTML=`<div class="panel"><span class="pill">Question ${qidx+1} of ${questions.length}</span><h2>Which picture matches the Spanish word?</h2><h2 class="word">${escapeHtml(w.es)}</h2><button class="secondary" onclick="speak(${JSON.stringify(w.es)})">🔊 Listen</button><div class="grid" style="margin-top:16px">${options.map(x=>`<button class="choice big" data-answer="${escapeHtml(x.file)}" onclick="choose(this,${JSON.stringify(w.file)})">${art(x,'quiz-art')}<span>${escapeHtml(x.en)}</span></button>`).join('')}</div><p id="feedback" aria-live="polite"></p><button id="continue" class="btn" style="display:none" onclick="qidx++;showQuiz()">Next →</button></div>`}
function choose(el,correct){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.answer===correct)b.classList.add('correct')});let ok=el.dataset.answer===correct;if(!ok)el.classList.add('wrong');document.getElementById('feedback').textContent=ok?'¡Muy bien! ⭐':'Good try! The green answer is correct.';document.getElementById('continue').style.display='inline-block'}
function review(){nav('review');let done=Object.values(progress).filter(Boolean).length;app.innerHTML=`<div class="hero"><h2>⭐ Your Agent Stars</h2><p><strong>${done}</strong> of 250 words explored.</p><p><strong>${Array.from({length:25},(_,i)=>words.filter(w=>w.mission===i+1).every(w=>progress[w.file])).filter(Boolean).length}</strong> of 25 missions completed.</p></div><div class="panel"><h2>Keep practicing!</h2><p>Your progress stays on this device. No account or personal information is required.</p><div class="actions"><button class="btn" onclick="quiz()">Play a quiz</button><button class="secondary" onclick="home()">Explore missions</button></div></div>`}
fetch('./words.json').then(r=>{if(!r.ok)throw Error('Vocabulary file missing');return r.json()}).then(d=>{words=d;home();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}).catch(e=>app.textContent='Could not load words.json. Open the app from a web server (such as GitHub Pages), not directly as a file. '+e.message);
</script></body></html>

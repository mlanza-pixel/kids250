const RELEASE={"app":"Spanish Agent Adventure","version":"6.4.0","build":"20261101012553","builtAtUTC":"2026-11-01T01:25:53.917469+00:00","curriculumVersion":"core250-25x10-1","artworkInventoryVersion":"6.4.0","cacheVersion":"spanish-agent-v6-4-0","releaseId":"SAA-v6-4-0"};let missions=[],legacy=[],active=1,stop=0,reviewAt=0,reviewScore=0,reviewOrder=[],reviewLocked=false,reviewType='picture',selectedLeft=null;const app=document.getElementById('app');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key='spanish-agent-v6-progress';let state={visited:{},stamps:{},mistakes:{},practiced:{},reviewResults:{},lastLesson:null};try{state={...state,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{}function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){console.warn('Progress save failed',e)}}const item=(m,i)=>missions[m-1].stops[i];let audioMuted=false;function toggleAudio(){audioMuted=!audioMuted;try{speechSynthesis.cancel()}catch{};document.querySelectorAll('.audio-toggle').forEach(b=>b.textContent=audioMuted?'🔇 Sound off':'🔊 Sound on');}const say=(text,lang='es-ES')=>{const status=document.getElementById('speechStatus');if(audioMuted){if(status)status.textContent='Sound is off. Turn it on in the header to listen.';return}if(!('speechSynthesis' in window)){if(status)status.textContent='Speech unavailable in this browser';return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.78;const voices=speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));if(voice)u.voice=voice;u.onstart=()=>{if(status)status.textContent='🔊 Playing audio…'};u.onend=()=>{if(status)status.textContent='✓ Finished'};u.onerror=e=>{if(status)status.textContent='Audio issue: '+e.error+'; check device volume and Spanish voice settings'};if(status)status.textContent='Starting Spanish audio…';speechSynthesis.speak(u)}catch(e){if(status)status.textContent=e.message}};

const specialSounds={'hola':'OH-lah','adiós':'ah-DYOHSS','buenos días':'BWEH-nohs DEE-ahs','buenas tardes':'BWEH-nahs TAR-dess','buenas noches':'BWEH-nahs NOH-chess','hasta luego':'AHS-tah LWEH-goh','hasta mañana':'AHS-tah mahn-YAH-nah','¿cómo estás?':'KOH-moh ess-TAHSS','gracias':'GRAH-syahs','por favor':'pohr fah-BOHR','sí':'see','no':'noh','yo':'yoh','tú':'too','uno':'OO-noh','dos':'dohss','tres':'tress','rojo':'ROH-hoh','azul':'ah-SOOL','verde':'BEHR-deh','amarillo':'ah-mah-REE-yoh','lunes':'LOO-ness','martes':'MAR-tess','miércoles':'MYEHR-koh-less','jueves':'HWEH-bess','viernes':'BYEHR-ness','sábado':'SAH-bah-doh','domingo':'doh-MEEN-goh','enero':'eh-NEH-roh','febrero':'feh-BREH-roh','marzo':'MAR-soh','abril':'ah-BREEL','mayo':'MAH-yoh','junio':'HOO-nyoh','julio':'HOO-lyoh','agosto':'ah-GOHS-toh','septiembre':'sep-TYEHM-breh','octubre':'ohk-TOO-breh','noviembre':'noh-BYEHM-breh','diciembre':'dee-SYEHM-breh','primavera':'pree-mah-BEH-rah','verano':'beh-RAH-noh','otoño':'oh-TOH-nyoh','invierno':'een-BYEHR-noh'};
function soundES(x){let t=String(x||'').toLowerCase().trim();if(specialSounds[t])return specialSounds[t];return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ch/g,'CH').replace(/ll/g,'Y').replace(/ñ/g,'ny').replace(/qu/g,'k').replace(/gue/g,'geh').replace(/gui/g,'gee').replace(/j/g,'h').replace(/ge/g,'heh').replace(/gi/g,'hee').replace(/v/g,'b').replace(/z/g,'s').replace(/ce/g,'seh').replace(/ci/g,'see').replace(/h/g,'').replace(/r/g,'r').replace(/a/g,'ah').replace(/e/g,'eh').replace(/i/g,'ee').replace(/o/g,'oh').replace(/u/g,'oo').replace(/\s+/g,'-');}
function soundEN(x){let t=String(x||'').toLowerCase().trim();let common={'hello':'heh-LOH','goodbye':'good-BYE','good morning':'good MOR-ning','good afternoon':'good af-ter-NOON','good night':'good NYTE','thank you':'THANK yoo','please':'PLEEZ','yes':'YESS','no':'NOH','red':'RED','blue':'BLOO','green':'GREEN','yellow':'YEL-oh','monday':'MUN-day','tuesday':'TOOZ-day','wednesday':'WENZ-day','thursday':'THURZ-day','friday':'FRY-day','saturday':'SAT-er-day','sunday':'SUN-day'};return common[t]||t.replace(/tion/g,'shun').replace(/ph/g,'f').replace(/ee/g,'ee').replace(/ing\b/g,'ing').replace(/\s+/g,'-');}
function phonetics(w){return '<div class="sounds"><div><b>🇪🇸 Spanish sounds like:</b> '+safe(soundES(w.es))+'</div><div><b>🇺🇸 English sounds like:</b> '+safe(soundEN(w.en))+'</div><small>Approximate pronunciation guides. Tap 🔊 to hear Spanish.</small></div>'}

function renderPageHeader(title,subtitle=''){return '<div class="card hero"><h1>'+title+'</h1><p>'+subtitle+'</p></div>'}const UNIT_NAMES=['First Words & Friends','My World & Everyday Life','Nature, Time & Discovery','Confident Spanish Agent'];

function home(){let got=Object.keys(state.stamps).filter(k=>state.stamps[k]).length;let explored=missions.reduce((a,m)=>a+m.stops.filter(w=>state.visited[w.id]).length,0);let next=missions.find(m=>m.stops.some(w=>!state.visited[w.id]))||missions[24];app.innerHTML='<section class="storybook-banner"><h1>Spanish Agent Adventure</h1><p>¡Hola, '+agentTitle()+'!</p><p>Learn 250 Spanish words. Explore missions. Collect stamps!</p><button class="btn" onclick="continueAdventure()">▶ Continue My Adventure</button></section><div class="card"><h2>🗺️ Choose Your World</h2><p>Four worlds · Six missions in each · Ten words per mission</p><div class="story-units">'+UNIT_NAMES.map((n,u)=>'<button class="story-unit" onclick="unitPage('+u+')"><img src="images/storybook/unit'+(u+1)+'.webp" alt="Illustrated landscape for Unit '+(u+1)+'"><span class="unit-text"><h3>Unit '+(u+1)+'</h3><b>'+safe(n)+'</b><small>'+missions.slice(u*6,u*6+6).filter(m=>state.stamps[m.id]).length+'/6 stamps earned</small></span></button>').join('')+'</div><button class="story-unit" style="width:100%;margin-top:12px;display:flex;align-items:center" onclick="map(25)"><img style="width:38%;height:115px" src="images/storybook/graduation.webp" alt="Glowing treasure chest"><span class="unit-text"><h3>🎓 Graduation Mission</h3>Discover your final 10 words!</span></button></div><div class="card"><div class="story-stamp-intro"><img src="images/storybook/fox.webp" alt="Agent Zorro, your friendly fox guide"><div><h2>🦊 Your Explorer Passport</h2><p><b>'+explored+' / 250</b> words explored<br><b>'+got+' / 25</b> stamps collected</p><button class="btn" onclick="stampCollection()">🏅 Open Passport</button></div></div></div><div class="card"><h2>✨ Explore & Learn</h2><div class="storybook-tools"><button onclick="howToPlay()">🗺️ How to Play</button><button onclick="glossary()">🔤 Words & Phrases</button><button onclick="myAgent()">🕵️ My Agent</button><button onclick="welcome()">🌟 Welcome Again</button><button onclick="bonus(1)">🔡 Alphabet</button><button onclick="bonus(2)">🎭 Stories</button><button onclick="bonus(3)">🏝️ Treasure Island</button><button onclick="bonus(4)">📅 Days</button><button onclick="bonus(5)">🌻 Months</button><button onclick="bonus(6)">🧩 Picture Match</button><button onclick="bossBattleMenu()">🛡️ Challenges</button><button onclick="developer()">⚙️ Diagnostics</button></div></div>'}

function map(n){active=n;let m=missions[n-1],visited=m.stops.filter(w=>state.visited[w.id]).length;let next=m.stops.findIndex(w=>!state.visited[w.id]);let ready=visited===10;app.innerHTML=navBar(n===25?'home()':'unitPage('+Math.floor((n-1)/6)+')')+renderPageHeader('🧭 Mission '+n+' · '+safe(m.title),'Follow Stops 1–10. Tap a stop to learn its Spanish word.')+'<div class="card storybook-map"><h2>Mission Trail · '+visited+' of 10 explored</h2><div class="progress-track"><div class="progress-fill" style="width:'+(visited*10)+'%"></div></div><p>🦊 '+agentTitle()+', choose a numbered stop. A ✓ means you explored it.</p><div class="trail-grid">'+m.stops.map((w,i)=>'<button class="trail-stop '+(state.visited[w.id]?'done':'')+'" onclick="learn('+i+')"><strong>'+(state.visited[w.id]?'✓':i+1)+'</strong><span>'+safe(w.emoji||'⭐')+'</span><small>'+safe(w.es)+'</small></button>').join('')+'</div><div class="row"><button class="btn" onclick="'+(ready?'openChest()':'learn('+(next<0?0:next)+')')+'">'+(ready?(state.stamps[n]?'🏆 See My Stamp':'🎯 Take Review & Earn Stamp'):'▶ Next Stop '+(next+1))+'</button><button class="btn alt" onclick="'+(n===25?'home()':'unitPage('+Math.floor((n-1)/6)+')')+'">← Back to Missions</button></div><p class="tiny">Explore 10 words → Take a 10-question review → Choose a treasure stamp. You can revisit any word.</p></div>'}

function teachingCalendar(day){return calendarGrid(2027,chosenWeekMonth,day)}
function weekCalendar(day=chosenWeekday){chosenWeekday=(day+7)%7;let w=calendarDays[chosenWeekday],icons=['🌞','🎨','📚','🚲','🎉','🏞️','🏡'];app.innerHTML=navBar()+renderPageHeader('📅 Days of the Week','Real calendar: 2027 · Every matching weekday is highlighted')+'<div class="card"><div class="word-grid">'+calendarDays.map((x,i)=>'<button class="bonus-word" onclick="weekCalendar('+i+');say(calendarDays['+i+'].es)"><strong>'+safe(x.es)+'</strong><span>'+safe(x.en)+'</span><span class="calendar-icon">'+icons[i]+'</span></button>').join('')+'</div><div class="detail" style="margin-top:15px;text-align:center"><h2>Card 8 · '+safe(w.es)+' · '+safe(w.en)+'</h2>'+teachingCalendar(chosenWeekday)+'<div class="row" style="justify-content:center"><button class="btn alt" onclick="chosenWeekMonth=(chosenWeekMonth+11)%12;weekCalendar(chosenWeekday)">← Month</button><span class="pill">'+MONTH_2027[chosenWeekMonth].en+' 2027</span><button class="btn alt" onclick="chosenWeekMonth=(chosenWeekMonth+1)%12;weekCalendar(chosenWeekday)">Month →</button></div><div class="row" style="justify-content:center"><button class="btn alt" onclick="weekCalendar(chosenWeekday-1)">← Previous</button><button class="btn" onclick="say(calendarDays[chosenWeekday].es)">🔊 Spanish</button><button class="btn alt" onclick="weekCalendar(chosenWeekday+1)">Next →</button></div><p id="speechStatus" class="status"></p></div></div>'}

const MONTH_2027=[{"es": "enero", "en": "January", "pron": "EH-neh-roh", "eventDay": 1, "icon": "🎆"}, {"es": "febrero", "en": "February", "pron": "feh-BREH-roh", "eventDay": 14, "icon": "💗"}, {"es": "marzo", "en": "March", "pron": "MAR-soh", "eventDay": 20, "icon": "🌷"}, {"es": "abril", "en": "April", "pron": "ah-BREEL", "eventDay": 22, "icon": "🌎"}, {"es": "mayo", "en": "May", "pron": "MAH-yoh", "eventDay": 31, "icon": "🇺🇸"}, {"es": "junio", "en": "June", "pron": "HOO-nyoh", "eventDay": 20, "icon": "☀️"}, {"es": "julio", "en": "July", "pron": "HOO-lyoh", "eventDay": 4, "icon": "🎆"}, {"es": "agosto", "en": "August", "pron": "ah-GOHS-toh", "eventDay": 15, "icon": "🏖️"}, {"es": "septiembre", "en": "September", "pron": "sep-TYEHM-breh", "eventDay": 22, "icon": "🍁"}, {"es": "octubre", "en": "October", "pron": "ohk-TOO-breh", "eventDay": 31, "icon": "🎃"}, {"es": "noviembre", "en": "November", "pron": "noh-BYEHM-breh", "eventDay": 25, "icon": "🦃"}, {"es": "diciembre", "en": "December", "pron": "dee-SYEHM-breh", "eventDay": 25, "icon": "🎄"}];
const SEASONS_2027=[['primavera','Spring','pree-mah-BEH-rah','🌷'],['verano','Summer','beh-RAH-noh','☀️'],['otoño','Autumn','oh-TOH-nyoh','🍁'],['invierno','Winter','een-BYEHR-noh','❄️']];
function miniCalendar2027(month,eventDay,eventIcon){let first=(new Date(2027,month,1).getDay()+6)%7;let count=new Date(2027,month+1,0).getDate();let h=['M','T','W','T','F','S','S'].map(d=>'<span class="mini-day mini-head">'+d+'</span>').join('');for(let i=0;i<first;i++)h+='<span class="mini-day mini-blank"></span>';for(let d=1;d<=count;d++)h+='<span class="mini-day '+(d===eventDay?'mini-event':'')+'" aria-label="'+d+(d===eventDay?' special picture':'')+'"><span>'+d+'</span>'+(d===eventDay?'<span class="mini-emoji">'+eventIcon+'</span>':'')+'</span>';return '<div class="mini-calendar" role="img" aria-label="2027 '+MONTH_2027[month].en+' calendar">'+h+'</div>'}
function monthCalendar(){app.innerHTML=navBar()+renderPageHeader('🍁 Months & Seasons','Real calendars: 2027 · dates align to actual weekdays')+'<div class="card"><div class="months-grid">'+MONTH_2027.map((m,i)=>'<div class="compact-month"><div class="month-title"><strong>'+safe(m.es)+'</strong> <small>('+safe(m.pron)+')</small></div><div class="month-en">'+safe(m.en)+'</div>'+miniCalendar2027(i,m.eventDay,m.icon)+'<button class="month-listen" onclick="say(MONTH_2027['+i+'].es)">🔊 Hear Spanish</button></div>').join('')+'</div><h2>🌷 Seasons · Las estaciones</h2><div class="seasons-compact">'+SEASONS_2027.map(x=>'<button class="season-card" onclick="say('+JSON.stringify(x[0]).replace(/"/g,'&quot;')+')"><span class="season-icon">'+x[3]+'</span><b>'+safe(x[0])+'</b><small>('+safe(x[2])+')</small><span>'+safe(x[1])+'</span><span>🔊 Spanish</span></button>').join('')+'</div><p id="speechStatus" class="status"></p></div>'}

let matchingRound=[],matchingRight=[],matchingLeft=null,matchingDone=new Set(),matchingMistakes=0;
function matchingStart(){const pool=missions.flatMap(m=>m.stops).filter(w=>w.es&&w.en&&w.emoji);let unique=[],seen=new Set();for(let w of pool){let id=String(w.es).toLowerCase();if(!seen.has(id)&&!String(w.es).includes(' ')){seen.add(id);unique.push(w)}}if(unique.length<10){app.innerHTML=navBar()+renderPageHeader('Picture Match','Not enough words yet');return}unique.sort(()=>Math.random()-.5);matchingRound=unique.slice(0,10);matchingRight=[...matchingRound].sort(()=>Math.random()-.5);matchingLeft=null;matchingDone=new Set();matchingMistakes=0;matchingRender()}
function matchingRender(message='Tap a Spanish word, then its matching picture.'){app.innerHTML=navBar()+renderPageHeader('🧩 Picture Match','Connect 10 Spanish words to pictures')+'<div class="card"><div class="row between"><span class="matching-score">'+matchingDone.size+' / 10 matched</span><button class="btn alt" onclick="matchingStart()">↻ New round</button></div><p id="matchFeedback" class="status" aria-live="polite">'+safe(message)+'</p><div class="matching-grid"><div class="matching-col"><b>🇪🇸 Spanish</b>'+matchingRound.map((w,i)=>'<button class="matching-choice '+(matchingDone.has(i)?'matched':matchingLeft===i?'selected':'')+'" '+(matchingDone.has(i)?'disabled':'')+' onclick="matchingChooseLeft('+i+')">'+safe(w.es)+(matchingDone.has(i)?' ✓':'')+'</button>').join('')+'</div><div class="matching-col"><b>🖼️ English</b>'+matchingRight.map(w=>{let i=matchingRound.indexOf(w);return '<button class="matching-choice '+(matchingDone.has(i)?'matched':'')+'" '+(matchingDone.has(i)?'disabled':'')+' onclick="matchingChooseRight('+i+')"><span class="picture">'+safe(w.emoji)+'</span>'+safe(w.en)+(matchingDone.has(i)?' ✓':'')+'</button>'}).join('')+'</div></div>'+(matchingDone.size===10?'<div class="story-panel"><h2>🏆 All ten matched!</h2><p>You did it! Try another round.</p><button class="btn" onclick="matchingStart()">Play again</button></div>':'')+'</div>'}
function matchingChooseLeft(i){if(matchingDone.has(i))return;matchingLeft=i;matchingRender('Now tap the matching picture!')}
function matchingChooseRight(i){if(matchingDone.has(i))return;if(matchingLeft===null){matchingRender('Choose a Spanish word first.');return}if(matchingLeft===i){matchingDone.add(i);matchingLeft=null;matchingRender(matchingDone.size===10?'Wonderful! All ten matched!':'Great match! ✓')}else{matchingMistakes++;matchingRender('Try again! Look for the picture that matches your selected word.')}}

function glossary(){window.dict=missions.flatMap(m=>m.stops).sort((a,b)=>a.es.localeCompare(b.es,'es'));window.dictLetter='ALL';window.dictMode='words';app.innerHTML=navBar()+renderPageHeader('📚 My Spanish Dictionary','250 unique Spanish words · Plus useful phrases')+'<div class="card"><div class="row dict-tabs"><button id="tabWords" class="btn" onclick="dictModePick(&quot;words&quot;)">📖 250 Words</button><button id="tabPhrases" class="btn alt" onclick="dictModePick(&quot;phrases&quot;)">💬 Phrases Used in App</button></div><div id="az" class="az"></div><input id="search" placeholder="Find a word…" oninput="dictRows()" aria-label="Search dictionary"><div id="dictResults"></div><p id="speechStatus" class="status" aria-live="polite"></p></div>';dictAZ();dictRows()}

function agentPhrases(){let n=agentName()||'Alex';return [{es:'Me llamo '+n+'.',en:'My name is '+n+'.'},{es:'Soy el agente '+n+'.',en:'I am Agent '+n+'.'},{es:'¡Muy bien, '+n+'!',en:'Very good, '+n+'!'},{es:'¡Lo logré!',en:'I did it!'}]}
function dictModePick(mode){window.dictMode=mode;window.dictLetter='ALL';document.getElementById('search').value='';document.getElementById('search').placeholder=mode==='phrases'?'Search phrases…':'Search words…';document.getElementById('tabWords').className=mode==='words'?'btn':'btn alt';document.getElementById('tabPhrases').className=mode==='phrases'?'btn':'btn alt';dictAZ();dictRows()}
function dictAZ(){document.getElementById('az').innerHTML=['ALL',...'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'].map(c=>'<button class="az-key '+(window.dictLetter===c?'selected':'')+'" onclick="dictPick(&quot;'+c+'&quot;)">'+c+'</button>').join('')}
function dictPick(c){window.dictLetter=c;dictAZ();dictRows()}
function dictRows(){let q=document.getElementById('search').value.toLocaleLowerCase('es');let phraseList=[...agentPhrases(),...Object.values(USE_IT).map(x=>({es:x[0],en:x[1]})),...STORY_SCENES.flatMap(x=>x.lines.map(l=>({es:l[0],en:l[1]})))].filter((w,i,a)=>a.findIndex(x=>x.es===w.es)===i);document.getElementById('az').style.display=window.dictMode==='phrases'?'none':'';let matches=(window.dictMode==='phrases'?phraseList:window.dict).filter(w=>(window.dictLetter==='ALL'||w.es.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().startsWith(window.dictLetter))&&(w.es+' '+w.en).toLocaleLowerCase('es').includes(q));document.getElementById('dictResults').innerHTML='<p>'+matches.length+(window.dictMode==='phrases'?' phrases':' words')+'</p>'+matches.map(w=>'<div class="dict-entry"><div><b>'+safe(w.es)+'</b> — '+safe(w.en)+'</div><div class="row"><button class="btn alt" aria-label="Hear Spanish '+safe(w.es)+'" onclick="say('+JSON.stringify(w.es).replace(/"/g,'&quot;')+')">🇪🇸 🔊</button><button class="btn alt" aria-label="Hear English '+safe(w.en)+'" onclick="say('+JSON.stringify(w.en).replace(/"/g,'&quot;')+',&quot;en-US&quot;)">🇺🇸 🔊</button></div></div>').join('')}

function copyDiagnostics(){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(window.diagnosticReport).then(()=>alert('Copied diagnostic report')).catch(()=>alert(window.diagnosticReport))}else alert(window.diagnosticReport)}
async function developer(){let reg=await navigator.serviceWorker?.getRegistration().catch(()=>null);let cacheNames=await caches.keys().catch(()=>[]);let online='Unknown';try{let r=await fetch('./release.json?check='+Date.now(),{cache:'no-store'});if(r.ok){let latest=await r.json();online=latest.build===RELEASE.build?'Current build matches server':'Server build: '+latest.build+' (running '+RELEASE.build+')'}}catch{online='Cannot check server (offline?)'}let report=['Spanish Agent Adventure diagnostics','Version: '+RELEASE.version,'Build: '+RELEASE.build,'Build UTC: '+RELEASE.builtAtUTC,'Release ID: '+RELEASE.releaseId,'Curriculum: '+RELEASE.curriculumVersion,'Artwork: '+RELEASE.artworkInventoryVersion,'Cache expected: '+RELEASE.cacheVersion,'Cache actual: '+cacheNames.join(', '),'Service worker: '+(reg?.active?.scriptURL||'Not active'),'Server check: '+online,'Browser: '+navigator.userAgent].join('\n');window.diagnosticReport=report;app.innerHTML=renderPageHeader('⚙️ Developer Information','For parents and release troubleshooting · Learning progress is saved on this device')+'<div class="card"><h2>Running version '+RELEASE.version+'</h2><p><b>Build:</b> '+RELEASE.build+'</p><p><b>Built UTC:</b> '+RELEASE.builtAtUTC+'</p><p><b>Release ID:</b> '+RELEASE.releaseId+'</p><p><b>Curriculum:</b> '+RELEASE.curriculumVersion+'</p><p><b>Artwork:</b> '+RELEASE.artworkInventoryVersion+'</p><p><b>Expected cache:</b> '+RELEASE.cacheVersion+'</p><p><b>Installed caches:</b> '+safe(cacheNames.join(', '))+'</p><p><b>Service worker:</b> '+safe(reg?.active?.scriptURL||'Not active')+'</p><p><b>Latest server check:</b> '+safe(online)+'</p><div class="row"><button class="btn" onclick="copyDiagnostics()">📋 Copy diagnostics</button><button class="btn alt" onclick="location.reload()">↻ Refresh app</button><button class="btn alt" onclick="home()">← Home</button></div><p class="tiny">Refreshing does not delete saved progress. A newer release may require a second refresh after the service worker updates.</p></div>'}
function splash(){app.innerHTML='<div class="card hero" style="text-align:center;padding:30px 20px"><div class="guide-hero">🦊 🗺️ ⭐</div><h1>Become a Spanish Word Explorer!</h1><p>Learn 250 different Spanish words! Explore 24 missions, complete the 10-word Graduation Mission, and collect 25 stamps with Agent Zorro.</p><p class="pill">Version '+safe(RELEASE.version)+'</p><div class="card" style="text-align:left"><h2>🕵️ What is your agent name?</h2><label for="agentName">First name or nickname (optional)</label><input id="agentName" maxlength="24" autocomplete="off" value="'+safe(agentName())+'" placeholder="Your name"><p class="tiny">Stored only on this device. You can change it later.</p><button class="btn" onclick="saveAgent()">▶ Enter Agent Headquarters</button><button class="btn alt" onclick="howToPlay()">📖 Review How to Play</button></div><p class="tiny">Your old stamps are safely saved in your progress history.</p></div>'}

async function boot(){
 const status=document.getElementById('app');
 const t=setTimeout(()=>{if(status.textContent.includes('Loading your cozy adventure'))status.innerHTML='<div class="card"><h2>Still loading…</h2><p>The lesson files are taking too long. Check your connection or update the cached app.</p><button class="btn" onclick="location.reload()">Try again</button><button class="btn alt" onclick="clearAppCache()">Clear app cache & reload</button><p class="tiny">Your saved progress will be kept.</p></div>'},7000);
 try{
   const fetchJSON=async file=>{const r=await fetch('./'+file+'?build='+RELEASE.build+'',{cache:'no-store'});if(!r.ok)throw Error(file+' returned HTTP '+r.status);return r.json()};
   const [a,b]=await Promise.all([fetchJSON('curriculum.json'),fetchJSON('words.json')]);
   if(!Array.isArray(a)||a.length!==25)throw Error('Expected 25 missions in curriculum.json');
   if(!Array.isArray(b)||b.length!==250)throw Error('Expected 250 entries in words.json');
   missions=a;legacy=b;
   if(!state.core250Migration){let classic=await fetchJSON('curriculum_classic_v6_2.json');let completed=new Set(classic.flatMap(m=>m.stops.filter(w=>state.visited[w.id]).map(w=>w.es.toLocaleLowerCase('es').trim().replace(/^(el|la|los|las|un|una)\s+/,'').trim())));state.classicStamps={...(state.stamps||{})};state.classicVisited={...(state.visited||{})};state.stamps={};state.reviewResults={};state.pendingReward=null;state.lastLesson=null;state.visited={};for(let m of missions)for(let w of m.stops)if(completed.has(w.es.toLocaleLowerCase('es').trim()))state.visited[w.id]=true;state.core250Migration=true;save();}

   document.getElementById('versionTag').textContent='v'+RELEASE.version;
   if(state.onboarded)home();else splash();
   if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=6.4.0',{updateViaCache:'none'}).then(r=>{watchUpdates(r);return r.update()}).catch(e=>console.warn('Service worker:',e));
 }catch(e){
   console.error('Startup failure:',e);
   status.innerHTML='<div class="card"><h2>Could not start the adventure</h2><p>'+safe(e.message)+'</p><p>Make sure index.html, curriculum.json and words.json are all in the GitHub repository root.</p><button class="btn" onclick="location.reload()">Try again</button><button class="btn alt" onclick="clearAppCache()">Clear app cache & reload</button><p class="tiny">Your saved progress will not be deleted.</p></div>';
 }finally{clearTimeout(t)}
}
function watchUpdates(reg){if(!reg)return;const prompt=()=>{if(document.getElementById('updateBanner'))return;let b=document.createElement('div');b.id='updateBanner';b.className='update-banner';b.innerHTML='<span>✨ New adventure available!</span><button class="btn" id="applyUpdate">Update now</button><button class="btn alt" id="laterUpdate">Later</button>';document.body.appendChild(b);document.getElementById('applyUpdate').onclick=()=>{if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});else location.reload()};document.getElementById('laterUpdate').onclick=()=>b.remove()};if(reg.waiting)prompt();reg.addEventListener('updatefound',()=>{let w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)prompt()})});}
let hadController=!!navigator.serviceWorker?.controller;if('serviceWorker'in navigator)navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController)location.reload();hadController=true});
async function clearAppCache(){
 try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope===new URL('./',location.href).href).map(r=>r.unregister()))}
 if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('spanish-agent-')).map(k=>caches.delete(k)))}
 }catch(e){console.warn('Cache reset:',e)}
 location.reload();
}
window.addEventListener('error',e=>{const a=document.getElementById('app');if(a&&a.textContent.includes('Loading your cozy adventure'))a.innerHTML='<div class="card"><h2>Startup error</h2><p>'+safe(e.message)+'</p><button class="btn" onclick="clearAppCache()">Clear app cache & reload</button></div>'});
boot();
</script></body></html>
